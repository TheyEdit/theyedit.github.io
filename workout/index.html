// horizontal focus pager: translateX slides, touch-swipe to peek, height follows the current page.
function FocusPager({ count, page, onPage, children }) {
  const wrapRef = useRef(null); const pageRefs = useRef([]);
  const touch = useRef(null);
  const [drag, setDrag] = useState(0);
  useLayoutEffect(() => { const el = pageRefs.current[page]; if (el && wrapRef.current) wrapRef.current.style.height = el.offsetHeight + "px"; }, [page, children]);
  const onTS = (e) => { touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, lock: null }; };
  const onTM = (e) => { const t = touch.current; if (!t) return;
    const dx = e.touches[0].clientX - t.x, dy = e.touches[0].clientY - t.y;
    if (t.lock == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) t.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (t.lock === "x") setDrag(dx); };
  const onTE = () => { const t = touch.current; touch.current = null;
    if (t && t.lock === "x" && Math.abs(drag) > 48) onPage(Math.max(0, Math.min(count - 1, page + (drag < 0 ? 1 : -1))));
    setDrag(0); };
  return (
    <div ref={wrapRef} className="overflow-hidden" style={{ transition: "height .25s ease" }} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      <div className="flex items-start" style={{ transform: `translateX(calc(${-page * 100}% + ${drag}px))`, transition: drag ? "none" : "transform .28s ease" }}>
        {Array.from({ length: count }, (_, i) => (
          <div key={i} ref={(el) => (pageRefs.current[i] = el)} className="w-full shrink-0 px-0.5">{children(i)}</div>
        ))}
      </div>
    </div>
  );
}

function NutBar({ icon, label, cur, goal, suffix = "", overIsBad = false }) {
  const pct = goal > 0 ? Math.min(1, cur / goal) : 0;

  return (
    <div>
      <div className="flex items-baseline justify-between">
        <span className="flex items-center gap-1.5 text-[13px]" style={{ color: C.bone }}>{icon}{label}</span>
        <span className="font-mono text-[11px]" style={{ color: over && overIsBad ? C.rust : C.ash }}>{Math.round(cur).toLocaleString()} / {Math.round(goal).toLocaleString()}{suffix}</span>
      </div>
      <div className="mt-1 h-1.5 w-full overflow-hidden rounded-full" style={{ background: "#2A2418" }}>
        <div className="h-full rounded-full" style={{ width: `${pct * 100}%`, background: fill, transition: "width .4s ease" }} />
      </div>
      <p className="mt-0.5 font-mono text-[9px]" style={{ color: C.ashDim }}>{over ? `+${Math.round(cur - goal).toLocaleString()} over` : `${Math.round(goal - cur).toLocaleString()} left`}</p>
    </div>
  );
}
// round a nutrient value sensibly by magnitude (big numbers whole, small values 1–2 decimals)

  const isDraftFlow = useRef(typeof factsPending === "boolean").current;
  const touched = useRef(false);   // true once the user edits amount/unit — the resolve reseed then leaves it alone
  const legacy = food.basisGrams == null && food.basis !== "per100";   // legacy 'item' → multiplier, no grams
  // one REAL portion, for display/defaults only: a labeled portionG beats the generic per100 scaling basis (basisGrams
  // is always 100 for per100 foods — not a portion); a genuine serving/item basisGrams (bun, staple) has no portionG override.
  const servG = food.portionG > 0 ? food.portionG : (food.basisGrams != null && food.basisGrams > 0 ? food.basisGrams : null);
  const hasServ = servG != null;   // a real portion/gram size → g⇄serving toggle

  const [unit, setUnit] = useState(hasServ && !editMode ? "serving" : "g");

  const [t, setT] = useState(() => { const d = initialT ? new Date(initialT) : new Date(); return d; });

  // recomputed against whatever servG/hasServ/seedGrams now are for the resolved food. User edits always win.

          <NutBar label="Carbs" cur={dt.carbs || 0} goal={g.carbs} suffix=" g" />

            <button onClick={() => setCf({ ...cf, save: !cf.save })} className="flex items-center gap-1.5 font-mono text-[10px]" style={{ color: cf.save ? C.gold : C.ashDim }}><span style={{ width: 12, height: 12, borderRadius: 3, border: `1px solid ${cf.save ? C.gold : C.edge}`, background: cf.save ? C.gold : "transparent", display: "inline-block" }} />save to favorites</button>
          </div>

          <div className="mt-4 space-y-1">
            {d.entries.map((e) => (
              <div key={e.id} className="flex items-center justify-between gap-2 text-[12px]" style={{ color: C.bone }}>
                <button onClick={() => openEntry(e)} className="flex items-center gap-2 min-w-0 flex-1 text-left active:opacity-70"><span style={{ color: C.ashDim }} className="font-mono text-[10px]">{tHM(e.t)}</span><span className="truncate">{e.label}{e.grams != null && <span style={{ color: C.ashDim }}> · {Math.round(e.grams)}g</span>}</span></button>

              </div>
            ))}
          </div>

            <div className="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2">
              {[["kcal", "kcal", 50], ["protein", "P", 5], ["carbs", "C", 5], ["fat", "F", 5], ["steps", "steps", 1000], ["water", "ml", 250]].map(([key, lab, stp]) => (
                <div key={key} className="flex items-center gap-1"><NumberField value={g[key]} step={stp} label={key} width={60} onChange={(n) => setNutGoals({ [key]: Math.max(0, Math.round(n)) })} /><span className="font-mono text-[9px]" style={{ color: C.ashDim }}>{lab}</span></div>

          ))}

        {(() => {
          const m = METRICS.find((x) => x.id === metric);
          const series = seriesFor(metric), avg = metricAvg(metric), goal = m.goal;
          let verdict = null, vcol = C.ash;
          if (goal && avg > 0) { const ratio = avg / goal; if (m.lowerBetter) { verdict = avg <= goal ? "avg under goal ✓" : `avg ${Math.round(avg - goal)} over`; vcol = avg <= goal ? C.sage : C.rust; } else { verdict = ratio >= 0.9 ? "hitting goal ✓" : `${Math.round(ratio * 100)}% of goal — slacking`; vcol = ratio >= 0.9 ? C.sage : C.rust; } }

          else if (metric === "sleep") { verdict = avg > 0 ? `avg ${avg.toFixed(1)}h${avg >= 7 ? " ✓" : " — low"}` : "log sleep"; vcol = avg >= 7 ? C.sage : C.rust; }
          const avgTxt = metric === "steps" ? `${(avg / 1000).toFixed(1)}k` : metric === "water" ? `${Math.round(avg)} ml` : Math.round(avg * 10) / 10;
          return (
            <>
              <div className="mt-2 font-mono text-[11px]"><span style={{ color: C.ash }}>avg <span style={{ color: C.bone }}>{avgTxt}</span>{metric === "water" ? "" : m.suffix}</span>{verdict ? <span className="ml-3" style={{ color: vcol }}>{verdict}</span> : null}</div>
              <div className="mt-3" style={{ height: 130, width: "100%" }}>

                  <LineChart data={series} margin={{ top: 6, right: 8, bottom: 0, left: -20 }}>

                    <YAxis tick={{ fill: C.ashDim, fontSize: 9, fontFamily: "monospace" }} stroke="#2A2418" width={34} domain={metric === "bw" ? ["auto", "auto"] : [0, "auto"]} />
                    <Tooltip contentStyle={{ background: "#15120A", border: `1px solid ${C.edge}`, borderRadius: 8, fontFamily: "monospace", fontSize: 11 }} labelStyle={{ color: C.ash }} itemStyle={{ color: C.bone }} formatter={(v) => [`${v}${m.suffix}`, m.label]} />
                    {goal ? <ReferenceLine y={goal} stroke={C.goldDim} strokeDasharray="2 4" /> : null}
                    <Line type="monotone" dataKey="v" stroke={C.gold} strokeWidth={2} dot={{ r: 2, fill: C.gold }} connectNulls isAnimationActive={false} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </>
          );
        })()}
      </div>

      {scanOpen && <BarcodeScanner onDetect={async (code) => {
        // resolution ladder: memory → OFF → not-found
        const known = findByBarcode(nut, code);
        if (known) { setScanOpen(false); setScanState(null); setDetail({ food: known, initialGrams: known.lastGrams }); return; }
        setScanState({ looking: true, code });

        setScanState({ notFound: true, code });   // clear not-found UI; "Enter manually" pre-seeds the custom form with this barcode. (the overlay offers photo-the-label / manual entry)
      }} onClose={() => { setScanOpen(false); setScanState(null); }} scanState={scanState}
        onManual={(code) => { setScanOpen(false); setScanState(null); setCf((c) => ({ ...c, barcode: code })); }}
        ai={ai} goals={g} dayTotalsBefore={dt} nutFoods={nut.foods} onFavFood={favFood} onAddFood={(payload) => logFood({ ...payload, dk: viewDate })} />}
      {detail && <FoodDetail food={detail.food} initialGrams={detail.initialGrams} initialT={detail.initialT} goals={g} dayTotalsBefore={detail.edit ? subNutr(dt, (d.entries.find((x) => x.id === detail.edit.id) || {}).nutr) : dt} isFav={!!(nut.foods || []).find((f) => f.id === detail.food.id && f.fav)} onFav={() => favFood(detail.food)} editMode={!!detail.edit} onAdd={(payload) => logFood({ ...payload, dk: viewDate })} onSave={(payload) => { editEntry(detail.edit.id, viewDate, { grams: payload.grams, nutr: payload.nutr, t: payload.t, label: payload.food.label }); if (payload.saveCorr) corrFood(payload.food, payload.nutr, payload.grams); }} onClose={() => setDetail(null)} />}
    </>
  );
}

// CardioView — Task 48 Part B made Cardio a first-class tab; Task 57 gave it something to say.
// It used to render one day at a time with no chart at all, which is exactly what he reported:
// "I cannot see anything but time and steps." Now the analysis comes first and the plumbing last —
// today, trend, consistency, progress, this week, records, sessions, manual entry, sync.
//
// Two constraints shaped every card below, and they pull in opposite directions:
//   1. He has ONE real walk. Anything that only works after three months of history is a failure
//      dressed as a roadmap, so the first screen has to be useful after a single session — records,
//      time-in-zone, week-against-the-WHO-line and the day hero all are.
//   2. Nothing may be rendered as fact that the data cannot support. Trend directions stay behind
//      PadCoach's own TrendDataFloor and print how far short they are; a figure PadCoach hasn't sent
//      says so by name instead of appearing as a zero. If the treadmill isn't moving, it says so.
function CardioView({ mem, importCardioExport, addManualCardio, removeManualCardio }) {
  const cardio = mem.cardio || DEFAULT.cardio;
  const days = cardio.days || {};
  const today = todayKey();
  const [viewDate, setViewDate] = useState(today);
  const isToday = viewDate === today;
  const k = viewDate;
  const cd = days[k] || null;                        // raw stored day (PadCoach + manual), if any
  const st = cardioDay(cd);                          // …normalized: derived rates, nulls where unknown
  const manual = (cd && cd.manual) || [];
  const [toast, setToast] = useState("");
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };
  const tHM = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const dLbl = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const [form, setForm] = useState({ type: "walk", durationMin: 0, distanceKm: 0, steps: 0 });
  const resetForm = () => setForm({ type: "walk", durationMin: 0, distanceKm: 0, steps: 0 });
  const [metric, setMetric] = useState("zone2");
  const [range, setRange] = useState("14d");         // 14d | 8w — same numbers, two zoom levels
  const [calRange, setCalRange] = useState("14d");   // 14d | 8w | all — the Calories card's own zoom
  const [calMethod, setCalMethod] = useState(false);
  const [openSess, setOpenSess] = useState(null);
  const [syncOpen, setSyncOpen] = useState(false);
  const card = "mt-4 rounded-2xl border p-5";
  const hdr = "font-mono text-[11px] uppercase tracking-[0.2em]";
  const sub = "font-mono text-[9px] uppercase tracking-wider";
  const cap = "mt-2 font-mono text-[9px] leading-relaxed";

  // ── derived once per render of the whole history ──
  const win14 = useMemo(() => cardioWindow(days, today, 14), [days, today]);
  const weeks8 = useMemo(() => cardioWeeks(days, today, 8), [days, today]);
  const cal = useMemo(() => cardioCalendar(days, today, 8), [days, today]);
  const agg28 = useMemo(() => cardioAgg(cardioWindow(days, today, 28)), [days, today]);
  const streak = useMemo(() => cardioStreak(days, today), [days, today]);
  const recs = useMemo(() => cardioRecords(days, today), [days, today]);
  const trend = useMemo(() => cardioTrendRows(days, today, 28), [days, today]);
  const spd90 = useMemo(() => cardioWindow(days, today, 90), [days, today]);
  const allDays = useMemo(() => Object.keys(days).sort().map((key) => ({ key, st: cardioDay(days[key]) })).filter((x) => x.st && x.st.walked), [days]);
  const everWalked = allDays.length;
  // Task 59 — PadCoach's whole-history analysis block. TOP-LEVEL, not per-day: these are trends over the
  // entire history, recomputed from scratch on every export, and keeping them out of `days` is also what
  // keeps them clear of CARDIO_DAY_CAP. null for a schema-1 payload — every card below tolerates that.
  const an = cardio.analytics || null;
  // Card 2's right-hand figure: the adaptive daily target, from analytics.volume (never a per-day key).
  const target = an && an.volume && an.volume.targetMinutes ? an.volume : null;
  // Task 59 — two different kinds of "not here", kept apart on purpose:
  //   missing  — PadCoach DOES compute it; this payload just doesn't carry it (a schema-1 export, or a
  //              trend with nothing behind it yet). It fills in by itself once he installs the newer build.
  //   deferred — PadCoach does not compute it AT ALL yet, verified in CoachExport.swift. Saying so
  //              separately stops the tab implying that installing a build would fix these.
  const missing = useMemo(() => {
    const have = { eff: !!(an && an.efficiency), dec: false, rest: !!(an && an.restingHeartRate && an.restingHeartRate.readings.length) };
    allDays.forEach((x) => { if (x.st.restingBPM != null || x.st.hrv) have.rest = true;
      x.st.sessions.forEach((s) => { if (s.decoupling) have.dec = true; }); });
    return [!have.eff && "efficiency trend", !have.dec && "per-session decoupling", !have.rest && "resting HR & HRV"].filter(Boolean);
  }, [allDays, an]);
  const deferred = useMemo(() => {
    const have = { hist: false, cad: false, rpe: false };
    allDays.forEach((x) => x.st.sessions.forEach((s) => {
      if (s.hrHistogram) have.hist = true; if (s.cadenceStepsPerMin != null) have.cad = true; if (s.effort != null) have.rpe = true; }));
    return [!have.cad && "cadence (steps/min)", !have.hist && "heart-rate histograms", !have.rpe && "perceived effort"].filter(Boolean);
  }, [allDays]);

  const fmt = (v, dp) => (v == null ? "—" : dp ? (Math.round(v * 10 ** dp) / 10 ** dp).toFixed(dp) : Math.round(v).toLocaleString());
  const mins = (sec) => Math.round((sec || 0) / 60);
  // Volume metrics read 0 on a day he didn't walk — that is a true fact. Rate metrics (HR, speed, % in
  // zone) read null, because "didn't walk" is not the same statement as "walked at zero km/h".
  const M = [
    { id: "zone2", label: "Zone-2 min", suffix: " min", dp: 0, day: (s) => (s ? s.zone2Min || 0 : 0), week: (w) => w.zone2Min },
    { id: "moving", label: "Moving", suffix: " min", dp: 0, day: (s) => (s ? s.movingSec / 60 : 0), week: (w) => w.movingSec / 60 },
    { id: "distance", label: "Distance", suffix: " km", dp: 1, day: (s) => (s ? s.distanceKm : 0), week: (w) => w.distanceKm },
    { id: "steps", label: "Steps", suffix: "", dp: 0, day: (s) => (s ? s.steps : 0), week: (w) => w.steps },
    // Task 63 — calories are a volume with holes in it, and the two cases must not look alike. A day he
    // did not walk really is 0 active kcal; a day he DID walk that produced no estimate is a null, drawn
    // as a break in the line. `gap` turns off connectNulls for exactly this series so the break shows.
    { id: "kcal", label: "Calories", suffix: " kcal", dp: 0, gap: true,
      day: (s) => (!s || !s.walked ? 0 : s.kcal != null ? s.kcal : null),
      week: (w) => (w.walkedDays === 0 ? 0 : w.kcalDays > 0 ? w.kcal : null) },
    // A RATE, so a blank week is blank rather than zero. The denominator is the time behind the
    // estimate, never the whole day — see cardioDay's own note.
    { id: "kcalHr", label: "kcal/h", suffix: " kcal/h", dp: 0, rate: true,
      day: (s) => (s && s.cal && s.calSec > 0 ? s.cal.kcal / (s.calSec / 3600) : null),
      week: (w) => (w.kcalSec > 0 ? w.kcal / (w.kcalSec / 3600) : null) },
    { id: "avgHr", label: "Avg HR", suffix: " bpm", dp: 0, rate: true, day: (s) => (s ? s.avgHr : null), week: (w) => w.avgHr },
    { id: "inZone", label: "% in zone", suffix: "%", dp: 0, rate: true, day: (s) => (s ? s.inZonePct : null), week: (w) => w.inZonePct },
    { id: "speed", label: `km/h @ ${Z2_MID}`, suffix: " km/h", dp: 2, rate: true, day: (s) => (s ? s.speedAtZone : null), week: (w) => w.speedAtZone },
  ];
  const m = M.find((x) => x.id === metric) || M[0];
  const rnd = (v) => (v == null ? null : Math.round(v * 100) / 100);
  const series = range === "8w"
    ? weeks8.map((w) => ({ d: w.lbl, v: rnd(m.week(w)) }))
    : win14.map((x) => { const [, mm, dd] = x.key.split("-"); return { d: `${+mm}/${+dd}`, v: rnd(m.day(x.st)) }; });
  const sVals = series.map((p) => p.v).filter((v) => v != null && (m.rate ? true : v > 0));
  const sAvg = sVals.length ? sVals.reduce((a, b) => a + b, 0) / sVals.length : null;
  // Task 59 — the reference line on every weekly volume view. The WHO's 150 min/week is near-meaningless
  // at his volume: a normal week for him is ~470 min, so that line sits on the floor of the chart and
  // every week clears it without saying anything. His OWN adaptive target × 7 is the honest line — and it
  // only exists once PadCoach sends analytics.volume, so the WHO floor stays as the fallback. Whichever
  // one is drawn is labelled by name, so he always knows which line he is looking at.
  const weekGoalPad = target && target.targetMinutes ? target.targetMinutes * 7 : null;
  const weekGoal = weekGoalPad != null ? weekGoalPad : WHO_WEEK_MIN;
  const weekGoalLabel = weekGoalPad != null ? "your target" : "WHO floor";
  const weekGoalNote = weekGoalPad != null
    ? `PadCoach's adaptive target, ${Math.round(target.targetMinutes)} min/day × 7`
    : `the WHO's ${WHO_WEEK_MIN} min/week floor — a stand-in until PadCoach sends your own target`;
  const chartGoal = m.id === "zone2" ? (range === "8w" ? weekGoal : target && target.targetMinutes) || null : null;

  // ── speed at 130 bpm: one point per day, only from sessions whose avg HR actually landed in the band ──
  const spdPts = spd90.filter((x) => x.st && x.st.speedAtZone != null).map((x) => { const [, mm, dd] = x.key.split("-"); return { d: `${+mm}/${+dd}`, v: Math.round(x.st.speedAtZone * 100) / 100 }; });
  const spdSessions = spd90.reduce((a, x) => a + (x.st ? x.st.bandSessions : 0), 0);
  const spdNow = spdPts.length ? spdPts[spdPts.length - 1].v : null;
  // Task 59 — PadCoach's own EfficiencyTrend verdict lives in analytics.efficiency, NOT on a session: a
  // session carries only a bare `efficiencyRatio`, with no direction and no confidence attached. This
  // block sees the full history and folds grade in, so it wins outright over anything derived here, and
  // its confidence sentence is written to be shown word for word.
  const padEff = an && an.efficiency ? an.efficiency : null;
  const padEffRatio = !padEff ? null
    : padEff.rolling.length ? padEff.rolling[padEff.rolling.length - 1].v
    : padEff.readings.length ? padEff.readings[padEff.readings.length - 1].v : null;
  const padRest = an && an.restingHeartRate && an.restingHeartRate.latestRollingBPM != null ? an.restingHeartRate : null;
  const padHrv = an && an.hrv && an.hrv.latestShortMs != null ? an.hrv : null;
  // ── Task 60 — the deep layer. Every one of these is a pure selector from the block above
  //    "deep cardio analytics", so the maths is pinned by tests and this component only draws it.
  const [projTab, setProjTab] = useState("volume");
  const [methodOpen, setMethodOpen] = useState(false);
  const [loadDetail, setLoadDetail] = useState(false);
  // His stated goal is 4–5 hours a day in zone. PadCoach's own goal wins when it sends one.
  const goalMin = (an && an.volume && an.volume.goalMinutes) || GOAL_MIN_FALLBACK;
  const verdict = useMemo(() => cardioFitnessVerdict(days, an, today), [days, an, today]);
  const loadHist = useMemo(() => cardioLoadHistory(days, today), [days, today]);
  const loadRows = useMemo(() => loadHist.rows.slice(-60).map((r) => { const [, mm, dd] = r.key.split("-");
    return { d: `${+mm}/${+dd}`, load: Math.round(r.load), ctl: Math.round(r.ctl * 10) / 10, atl: Math.round(r.atl * 10) / 10 }; }), [loadHist]);
  const mono = useMemo(() => loadMonotony(loadHist.rows.slice(-7).map((r) => r.load)), [loadHist]);
  const efPts = useMemo(() => cardioSessionPoints(days, today, null, sessionEF), [days, today]);
  const efChart = useMemo(() => efPts.map((p) => { const [, mm, dd] = p.key.split("-");
    return { d: `${+mm}/${+dd}`, v: Math.round(p.y * 1000) / 1000 }; }), [efPts]);
  // The most recent sessions that produced a decoupling reading, newest first.
  const decRows = useMemo(() => {
    const out = [];
    Object.keys(days).filter((x) => x <= today).sort().reverse().forEach((key) => {
      if (out.length >= 6) return;
      const d = cardioDay(days[key]); if (!d) return;
      d.sessions.forEach((s) => { const dc = sessionDecoupling(s); if (dc && !dc.tooShort && out.length < 6) out.push({ key, s, dc }); });
    });
    return out;
  }, [days, today]);
  const projVolume = useMemo(() => cardioProjection(cardioDayPoints(days, today, null, (s) => s.zone2Min),
    { id: "volume", label: "Zone-2 minutes a day", unit: " min", dp: 0, target: goalMin, betterUp: true }), [days, today, goalMin]);
  const projRhr = useMemo(() => cardioProjection(cardioDayPoints(days, today, null, (s) => s.restingBPM),
    { id: "rhr", label: "Resting HR", unit: " bpm", dp: 0, betterUp: false }), [days, today]);
  const projSpeed = verdict.speed, projEF = verdict.ef;
  const PROJ = [
    { id: "volume", label: "Volume", pr: projVolume, what: "zone-2 minutes on the days PadCoach measured", target: goalMin, targetLabel: `${Math.round(goalMin)} min/day` },
    { id: "speed", label: `km/h @ ${Z2_MID}`, pr: projSpeed, what: "average belt speed on sessions whose own average heart rate landed in the band", target: null },
    { id: "ef", label: "Efficiency", pr: projEF, what: "Efficiency Factor — metres per minute, per heartbeat", target: null },
    { id: "rhr", label: "Resting HR", pr: projRhr, what: "the seated pre-walk baseline PadCoach records", target: null },
  ].filter((x) => x.pr && x.pr.n > 0);
  const projSel = PROJ.find((x) => x.id === projTab) || PROJ[0] || null;
  // The horizon follows the projection: a crossing 14 months out that is drawn on a 90-day chart
  // is a chart that contradicts the sentence under it. Capped so a barely-rising line does not
  // draw ten years of nothing.
  const projAhead = useMemo(() => { const c = projSel && projSel.pr.cross; if (!c) return 90;
    const want = c.latestUnbounded ? c.central : Math.max(c.central || 0, c.latest || 0);
    return Math.min(900, Math.max(90, Math.round((want || 90) * 1.1))); }, [projSel]);
  const projSeries = useMemo(() => (projSel ? cardioFitSeries(projSel.pr, today, projAhead, Math.max(3, Math.round(projAhead / 40))) : []), [projSel, today, projAhead]);
  const aheadKey = (n) => (n == null ? null : shiftDate(today, Math.min(n, 3650)));
  const monthsish = (n) => (n == null ? "" : n < 60 ? `${Math.round(n)} days` : n < 730 ? `${Math.round(n / 30.4)} months` : `${(n / 365).toFixed(1)} years`);
  const stateCol = (s) => (s === "better" ? C.sage : s === "worse" ? C.rust : s === "flat" ? C.ash : C.ashDim);
  // A slope always gets one more decimal than the value it is a slope of, so a resting-HR trend of
  // −0.64 bpm/30 days never prints as "−1 · 95% range −1 to −1" — a range with no width.
  const slopeDp = projSel ? Math.max(projSel.pr.dp, 1) : 1;

  const arrow = { up: "↑", down: "↓", flat: "→" };
  const dirCol = (r) => (!r.ready || !r.better ? C.ash : r.dir === "flat" ? C.ash : (r.dir === r.better ? C.sage : C.rust));
  const cellBg = (s) => {
    if (!s || !s.walked) return C.edge;
    const mn = s.zone2Min != null ? s.zone2Min : s.movingSec / 60;      // fall back to moving time when there's no HR
    return `rgba(201,162,39,${Math.max(0.18, Math.min(1, mn / 120)).toFixed(2)})`;
  };
  // Only weeks that overlap the history he actually has count toward the weekly average — averaging in
  // the weeks before his first logged walk would report "avg 0 min/week" at someone who walked 75 minutes.
  const firstKey = allDays.length ? allDays[0].key : null;
  const liveWeeks = weeks8.filter((w) => !w.partial && firstKey && shiftDate(w.start, 6) >= firstKey);
  const weekOver = liveWeeks.filter((w) => w.zone2Min >= weekGoal).length;
  const doneWeeks = liveWeeks.length;
  const wkAvg = doneWeeks ? liveWeeks.reduce((a, w) => a + w.zone2Min, 0) / doneWeeks : null;
  const thisWeek = weeks8[weeks8.length - 1];
  // Only weeks that overlap the history he actually has — comparing two weeks that both pre-date
  // his first logged walk would print "0 min against 0", which is a fact about the calendar.
  const wow = useMemo(() => cardioWeekOverWeek(liveWeeks), [liveWeeks]);

  // ── Task 63 · Energy ── Three windows of the same statistic, never three different statistics.
  // Every one of these is a pure selector pinned by tests/run-tests.mjs; this component only draws them.
  const cal14 = useMemo(() => cardioCalorieStats(days, today, 14), [days, today]);
  const cal56 = useMemo(() => cardioCalorieStats(days, today, 56), [days, today]);
  const calAll = useMemo(() => cardioCalorieStats(days, today, null), [days, today]);
  const calDrv = useMemo(() => cardioCalorieDrivers(days, today, null), [days, today]);
  // The cumulative view runs from his first logged day, capped at the retention cap so a long history
  // cannot draw a chart with three thousand points in it.
  const calSpan = useMemo(() => (allDays.length ? Math.min(CARDIO_DAY_CAP, dayNum(today) - dayNum(allDays[0].key) + 1) : 1), [allDays, today]);
  const calDaily = useMemo(() => cardioCalorieSeries(days, today, 14, false), [days, today]);
  const calCum = useMemo(() => cardioCalorieSeries(days, today, calSpan, true), [days, today, calSpan]);
  // Weekly totals carry the same band, and a week he walked with no estimate anywhere in it is a null
  // rather than a zero bar — the same rule as the daily view, one zoom level out.
  const calWeekly = useMemo(() => weeks8.map((w) => ({ d: w.lbl,
    v: w.walkedDays === 0 ? 0 : w.kcalDays > 0 ? Math.round(w.kcal) : null,
    lo: w.walkedDays === 0 ? 0 : w.kcalDays > 0 ? Math.round(w.kcalLow) : null,
    hi: w.walkedDays === 0 ? 0 : w.kcalDays > 0 ? Math.round(w.kcalHigh) : null,
    gap: w.walkedDays > 0 && w.kcalDays === 0, partial: w.kcalGapDays > 0 })), [weeks8]);
  const cs = calRange === "14d" ? cal14 : calRange === "8w" ? cal56 : calAll;
  const calSeries = calRange === "14d" ? calDaily : calRange === "8w" ? calWeekly : calCum;
  const calWindowLabel = calRange === "14d" ? "last 14 days" : calRange === "8w" ? "last 8 weeks" : "all time";
  const calCumulative = calRange === "all";
  // The blanks, said in the shape they actually have. `olderMissing` is his real case and reads as a
  // bug unless it is named: everything before PadCoach's calorie fix carries no estimate at all.
  const calShapeLine = {
    none: "That is a fact about the export, not about your walking. A calorie figure needs the treadmill grade and your body weight, and a session replayed without your body settings loses it — so the estimate never reached this app even though the walk did. PadCoach recomputes the whole payload on every sync, so the figures appear here on their own the moment it sends them. Nothing on this card is filling the gap in with a guess in the meantime.",
    complete: "Every walked day in this window carries an estimate.",
    olderMissing: "Your older days carry no estimate and the recent ones do. PadCoach used to recompute a replayed session without your body settings, which dropped the figure; days exported since carry it. The blank stretch fills in on a full re-export — nothing here is guessing at it in the meantime.",
    newerMissing: "Your most recent days carry no estimate while older ones do — usually a session that finished without a grade or body weight recorded.",
    scattered: "The blanks are scattered rather than in one stretch, which usually means individual sessions were missing an input rather than a whole run of exports being stale.",
    empty: "",
  }[cs.shape] || "";
  const calFmt = (v) => (v == null ? "—" : Math.round(v).toLocaleString());

  return (
    <>
      <div className="mt-6 flex items-center justify-between">
        <button onClick={() => setViewDate(shiftDate(viewDate, -1))} aria-label="previous day" className="flex h-11 w-11 items-center justify-center rounded-full active:scale-90" style={{ color: C.ash }}><ChevronLeft size={18} /></button>
        <div className="flex flex-col items-center">
          <span className="font-mono text-[12px] font-bold" style={{ color: isToday ? C.gold : C.bone }}>{relDay(viewDate)}</span>
          <input type="date" value={viewDate} onChange={(e) => e.target.value && setViewDate(e.target.value)} className="bg-transparent font-mono text-[16px] outline-none" style={{ color: C.ash, colorScheme: "dark" }} />
        </div>
        <button onClick={() => setViewDate(shiftDate(viewDate, 1))} aria-label="next day" className="flex h-11 w-11 items-center justify-center rounded-full active:scale-90" style={{ color: C.ash }}><ChevronRight size={18} /></button>
      </div>

      {/* ── 2. The day ── hero pair: minutes in zone against whatever the honest comparison is today. */}
      <div className={card} style={{ background: C.card, borderColor: C.edge }}>
        <span className={hdr} style={{ color: C.ash }}><Footprints size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />{isToday ? "Today" : relDay(viewDate)}</span>
        {st && st.walked ? (
          <>
            <div className="mt-3 flex items-end justify-between gap-3">
              <div>
                <p className={sub} style={{ color: C.ashDim }}>{st.zone2Min != null ? "minutes in zone 2" : "moving time"}</p>
                <p className="font-mono text-2xl font-bold" style={{ color: C.bone }}>{st.zone2Min != null ? Math.round(st.zone2Min) : mins(st.movingSec)}<span className="ml-1 font-mono text-[13px] font-normal" style={{ color: C.ash }}>min</span></p>
              </div>
              {/* The comparison is a ZONE-2 figure, so it only belongs beside a zone-2 hero. On a
                  manual-only day the hero is moving time and "30 of 98" would be comparing two
                  different things, so the whole right-hand column and its target notes drop out. */}
              {st.zone2Min != null && (
                <div className="text-right">
                  <p className={sub} style={{ color: C.ashDim }}>{target ? "PadCoach target" : "your 28-day avg"}</p>
                  {/* An average of one day IS that day, so comparing today against it would be circular —
                      it needs a few days behind it before it is a comparison at all. */}
                  <p className="font-mono text-xl font-bold" style={{ color: target || agg28.walkedDays >= 3 ? C.gold : C.ashDim }}>{target ? Math.round(target.targetMinutes) : agg28.walkedDays >= 3 ? Math.round(agg28.zone2Min / agg28.walkedDays) : "—"}<span className="ml-1 font-mono text-[12px] font-normal" style={{ color: C.ash }}>min</span></p>
                  {!target && agg28.walkedDays < 3 && <p className="font-mono text-[9px]" style={{ color: C.ashDim }}>needs 3+ days to average</p>}
                </div>
              )}
            </div>
            {/* `holdMessage` is VolumeProgression's own single factual line, written to be rendered verbatim.
                A day under target is DATA, not failure — nothing here is ever red. */}
            {st.zone2Min != null && target && (target.holdMessage || target.holdReason) && <p className={cap} style={{ color: C.ashDim }}>{target.holdMessage || `increase held back — ${target.holdReason}`}</p>}
            {st.zone2Min != null && target && target.projectedDaysToGoal != null && <p className="mt-1 font-mono text-[10px]" style={{ color: C.ash }}>projected to reach {target.goalMinutes ? `${Math.round(target.goalMinutes)} min/day` : "the goal"} in ~{Math.round(target.projectedDaysToGoal)} days{target.projectedDate ? ` · ${target.projectedDate}` : ""}</p>}
            <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1.5 font-mono text-[11px]" style={{ color: C.bone }}>
              <span>{st.steps.toLocaleString()} steps</span>
              <span>{st.distanceKm.toFixed(2)} km</span>
              <span>{fmtHM(st.movingSec / 3600)} moving</span>
              {st.sessions.length > 0 && <span style={{ color: C.ash }}>{st.sessions.length} session{st.sessions.length === 1 ? "" : "s"}</span>}
            </div>
            {/* Zone-2 minutes, calories and % in zone are heart-rate figures — PadCoach-only, never padded
                out with a manual entry's guess. A manual-only day simply doesn't show them. */}
            <div className="mt-1.5 flex flex-wrap items-center gap-x-4 gap-y-1.5 font-mono text-[10px]" style={{ color: C.ashDim }}>
              {st.inZonePct != null && <span><span style={{ color: C.sage }}>{Math.round(st.inZonePct)}%</span> of measured walking inside the band</span>}
              {st.avgHr != null && <span>avg {Math.round(st.avgHr)} bpm{st.maxHr ? ` · max ${Math.round(st.maxHr)}` : ""}</span>}
              {/* Task 63 — "active" is not decoration. Comparing this against a treadmill console
                  (gross) or a food label (also effectively gross) without that word compares two
                  different quantities. The band travels with it, always. */}
              {st.cal && <span style={{ color: C.bone }}>≈{Math.round(st.cal.kcal)} kcal active <span style={{ color: C.ashDim }}>({Math.round(st.cal.lowKcal)}–{Math.round(st.cal.highKcal)}{st.cal.bandPct != null ? `, ±${Math.round(st.cal.bandPct)}%` : ""})</span></span>}
              {st.cal && st.calSec > 0 && <span>{Math.round(st.cal.kcal / (st.calSec / 3600))} kcal/h{st.calKm > 0 ? ` · ${Math.round(st.cal.kcal / st.calKm)} kcal/km` : ""}</span>}
              {/* resting HR is from the seated pre-walk baseline, never from the walk — `restingSource`
                  says whether it was measured, typed in by hand, or a mix of both that day. */}
              {st.restingBPM != null && <span>resting {Math.round(st.restingBPM)} bpm{st.restingSource ? ` (${st.restingSource})` : ""}</span>}
              {st.hrv && st.hrv.rmssdMs != null && <span>HRV {Math.round(st.hrv.rmssdMs)} ms rmssd{st.hrv.quality === "usableWithCaveat" ? " (usable, with a caveat)" : ""}</span>}
            </div>
            {st.sessions.length === 0 && manual.length > 0 && <p className={cap} style={{ color: C.ashDim }}>manual entry only — no heart rate was measured, so there are no zone-2 minutes or calories for this day.</p>}
            {/* Task 63 — a measured day with NO calorie figure has to say which kind of nothing it is,
                rather than quietly omitting the line and reading as "zero calories". */}
            {!st.cal && st.sessions.length > 0 && (
              <p className={cap} style={{ color: C.ashDim }}>
                no calorie estimate for this day{st.sessions.map((s) => s.calUnavailableReason).find(Boolean)
                  ? ` — ${st.sessions.map((s) => s.calUnavailableReason).find(Boolean)}`
                  : " — PadCoach returns nothing for a session missing the treadmill grade or your body weight, and this app has never invented one. It fills in by itself if PadCoach re-exports the day."}
              </p>
            )}
            {/* A PARTIAL day: minutes were worked that the walking equations do not apply to. */}
            {st.cal && st.calOmitted && (
              <p className={cap} style={{ color: C.ashDim }}>{st.calOmitted.reason || `this figure leaves out ${st.calOmitted.modalities.join(", ")} — PadCoach has no calorie model for it, so the day's total is an undercount rather than a complete number.`}</p>
            )}
          </>
        ) : (
          <p className="mt-2 font-mono text-[10px]" style={{ color: C.ashDim }}>nothing recorded for this day yet</p>
        )}
      </div>

      {everWalked === 0 ? (
        /* Deliberately empty, not broken: there is genuinely nothing to chart yet, and inventing a
           scaffold of zero-height bars would be a worse answer than saying so. */
        <div className={card} style={{ background: C.card, borderColor: C.edge }}>
          <span className={hdr} style={{ color: C.ash }}><TrendingUp size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />Progress</span>
          <p className="mt-2 text-[12.5px]" style={{ color: C.ash }}>No walks have reached this app yet. Everything else on this tab — the trend, active calories, the consistency calendar, efficiency and decoupling, training load, weekly volume, records, and the projections — appears after the first one. PadCoach syncs on its own, or add a walk by hand below. The Method card at the bottom already explains what each of those will mean, and which famous metrics this app deliberately will not compute.</p>
        </div>
      ) : (
        <>
          {/* ── Task 60 · the top line ── One question, answered honestly or not at all. Each row is a
              separate measurement rather than a blended score, so nothing can average a strong signal
              together with a signal that has no data behind it. */}
          <div className={card} style={{ background: C.card, borderColor: C.edge }}>
            <span className={hdr} style={{ color: C.ash }}><Sparkles size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />Are you getting fitter?</span>
            <p className="mt-2 text-[13px] leading-relaxed" style={{ color: verdict.ready ? C.bone : C.ash }}>{verdict.headline}</p>
            <div className="mt-3 flex flex-col gap-1.5">
              {verdict.signals.map((s) => (
                <div key={s.id} className="flex items-baseline justify-between gap-3 font-mono text-[11px]">
                  <span className="shrink-0" style={{ color: s.state === "waiting" ? C.ashDim : C.bone }}>{s.label}</span>
                  {s.state === "waiting" ? (
                    <span className="text-right" style={{ color: C.ashDim }}>{s.need || "not enough data yet"}</span>
                  ) : (
                    <span className="text-right" style={{ color: stateCol(s.state) }}>
                      {(s.moved === "up" ? "↑ " : s.moved === "down" ? "↓ " : "→ ")}{s.state === "better" ? "better" : s.state === "worse" ? "worse" : "steady"}
                      {s.detail ? <span className="ml-2" style={{ color: C.ashDim }}>{s.detail}</span> : null}
                    </span>
                  )}
                </div>
              ))}
            </div>
            <p className={cap} style={{ color: C.ashDim }}>
              a row only takes a side when its own 95% interval excludes zero, so “waiting” means the data genuinely cannot yet tell the difference — it is not a hidden zero.
              minutes walked is deliberately not one of these rows: walking more is doing <em>more</em>, not being fitter, and it is the one number you set directly.
            </p>
          </div>

          {/* ── 3. Trend ── the Diet tab's chart, pointed at cardio. Same numbers, two zoom levels. */}
          <div className={card} style={{ background: C.card, borderColor: C.edge }}>
            <div className="flex items-center justify-between gap-2">
              <span className={hdr} style={{ color: C.ash }}><TrendingUp size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />Trend</span>
              <div className="flex gap-1.5">
                {[["14d", "14 days"], ["8w", "8 weeks"]].map(([id, lab]) => (
                  <button key={id} onClick={() => setRange(id)} className="rounded-full border px-3 py-1 font-mono text-[10px]" style={{ borderColor: range === id ? C.goldDim : C.edge, background: range === id ? "#241F12" : "transparent", color: range === id ? C.gold : C.ash }}>{lab}</button>
                ))}
              </div>
            </div>
            <div className="mt-3 flex gap-1.5 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>
              {M.map((x) => (
                <button key={x.id} onClick={() => setMetric(x.id)} className="shrink-0 rounded-full border px-3 py-1.5 font-mono text-[11px] whitespace-nowrap" style={{ borderColor: metric === x.id ? C.goldDim : C.edge, background: metric === x.id ? "#241F12" : "transparent", color: metric === x.id ? C.gold : C.ash }}>{x.label}</button>
              ))}
            </div>
            <div className="mt-2 font-mono text-[11px]">
              <span style={{ color: C.ash }}>avg <span style={{ color: C.bone }}>{fmt(sAvg, m.dp)}</span>{m.suffix}{range === "8w" ? (m.rate ? "" : "/week") : m.rate ? "" : " per day walked"}</span>
              <span className="ml-3" style={{ color: C.ash }}>{sVals.length} of {series.length} {range === "8w" ? "weeks" : "days"} with data</span>
            </div>
            <div className="mt-3" style={{ height: 130, width: "100%" }}>
              <ResponsiveContainer>
                <LineChart data={series} margin={{ top: 6, right: 8, bottom: 0, left: 0 }}>
                  <CartesianGrid stroke="#221E15" vertical={false} />
                  <XAxis dataKey="d" tick={{ fill: C.ashDim, fontSize: 8, fontFamily: "monospace" }} stroke="#2A2418" interval={range === "8w" ? 0 : 2} />
                  <YAxis tick={{ fill: C.ashDim, fontSize: 9, fontFamily: "monospace" }} stroke="#2A2418" width={40} domain={m.rate ? ["auto", "auto"] : [0, chartGoal ? (mx) => niceCeil(Math.max(mx * 1.02, chartGoal * 1.05)) : "auto"]} />
                  <Tooltip contentStyle={{ background: "#15120A", border: `1px solid ${C.edge}`, borderRadius: 8, fontFamily: "monospace", fontSize: 11 }} labelStyle={{ color: C.ash }} itemStyle={{ color: C.bone }} formatter={(v) => [`${v}${m.suffix}`, m.label]} />
                  {chartGoal ? <ReferenceLine y={chartGoal} stroke={C.goldDim} strokeDasharray="2 4" /> : null}
                  <Line type="monotone" dataKey="v" stroke={C.gold} strokeWidth={2} dot={{ r: 2, fill: C.gold }} connectNulls={!m.gap} isAnimationActive={false} />
                </LineChart>
              </ResponsiveContainer>
            </div>
            <p className={cap} style={{ color: C.ashDim }}>
              {m.id === "kcal"
                ? `${range === "8w" ? "weeks" : "days"} you didn't walk count as zero, because they are — but a ${range === "8w" ? "week" : "day"} you DID walk that produced no estimate breaks the line instead, because a missing calorie figure is not a zero one. the Calories card below says how many, and why.`
                : m.id === "kcalHr"
                ? `active kcal ÷ the hours that actually produced an estimate, never the whole ${range === "8w" ? "week" : "day"}. this is the figure that doesn't just restate how long you walked — but it also moves when you change the incline, so read it beside the Calories card rather than as a fitness signal.`
                : m.rate
                ? `a ${range === "8w" ? "week" : "day"} with no measured heart rate leaves a gap rather than a zero — you didn't walk at 0 bpm.`
                : `${range === "8w" ? "weeks" : "days"} you didn't walk count as zero, because they are.`}
              {chartGoal ? ` dashed line = ${range === "8w" ? weekGoalNote : "PadCoach's adaptive target for the day"}.` : ""}
              {sVals.length < 3 ? " the line needs a few more days before its shape means anything." : ""}
            </p>
          </div>

          {/* ── Task 63 · Energy ── The answer to "there is NO CALORIES ANYWHERE". Everything on this
              card is arithmetic over what PadCoach sent; nothing here estimates a calorie, and the days
              that genuinely have none are counted and named rather than drawn as zeroes. */}
          <div className={card} style={{ background: C.card, borderColor: C.edge }}>
            <div className="flex items-center justify-between gap-2">
              <span className={hdr} style={{ color: C.ash }}><Flame size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />Calories</span>
              <div className="flex gap-1.5">
                {[["14d", "14 days"], ["8w", "8 weeks"], ["all", "all time"]].map(([id, lab]) => (
                  <button key={id} onClick={() => setCalRange(id)} className="rounded-full border px-3 py-1 font-mono text-[10px]" style={{ borderColor: calRange === id ? C.goldDim : C.edge, background: calRange === id ? "#241F12" : "transparent", color: calRange === id ? C.gold : C.ash }}>{lab}</button>
                ))}
              </div>
            </div>

            {cs.estDays === 0 ? (
              /* The state he is actually in today. Deliberately a paragraph and not an empty chart:
                 a scaffold of zero-height bars would answer "where are my calories" with a picture of
                 zero calories, which is the one answer that is false. */
              <>
                <p className="mt-3 text-[12.5px] leading-relaxed" style={{ color: C.ash }}>
                  {cs.walkedDays === 0
                    ? "No walking in this window, so there is no energy to total."
                    : cs.walkedDays === 1
                    ? <>The one day you walked here — {fmtHM(cs.gap[0].movingSec / 3600)} of it — carries no calorie estimate.</>
                    : <>None of the {cs.walkedDays} days you walked here carries a calorie estimate, across {fmtHM(cs.gap.reduce((a, g) => a + g.movingSec, 0) / 3600)} of walking.</>}
                </p>
                {calShapeLine && <p className="mt-2 text-[12.5px] leading-relaxed" style={{ color: C.ash }}>{calShapeLine}</p>}
                {cs.gapManualOnly > 0 && (
                  <p className="mt-2 font-mono text-[10px] leading-relaxed" style={{ color: C.ashDim }}>
                    {cs.gapManualOnly} of them {cs.gapManualOnly === 1 ? "is" : "are"} a manual entry — no heart rate, no belt speed and no grade were measured, so there is nothing to run a model against. Those stay blank permanently, and that is correct.
                  </p>
                )}
                {calAll.estDays > 0 && calRange !== "all" && (
                  <p className="mt-2 font-mono text-[10px]" style={{ color: C.ashDim }}>your whole history does carry {calAll.estDays} day{calAll.estDays === 1 ? "" : "s"} with an estimate — switch to “all time”.</p>
                )}
              </>
            ) : (
              <>
                <div className="mt-3 flex items-end justify-between gap-3">
                  <div>
                    <p className={sub} style={{ color: C.ashDim }}>{calWindowLabel} · active</p>
                    <p className="font-mono text-2xl font-bold" style={{ color: C.bone }}>{calFmt(cs.kcal)}<span className="ml-1 font-mono text-[13px] font-normal" style={{ color: C.ash }}>kcal</span></p>
                    <p className="font-mono text-[10px]" style={{ color: C.ashDim }}>{calFmt(cs.lowKcal)}–{calFmt(cs.highKcal)}{cs.bandPct != null ? ` · ±${Math.round(cs.bandPct)}%` : ""}</p>
                  </div>
                  <div className="text-right">
                    <p className={sub} style={{ color: C.ashDim }}>per day</p>
                    <p className="font-mono text-xl font-bold" style={{ color: C.gold }}>{calFmt(cs.perDay.v)}<span className="ml-1 font-mono text-[12px] font-normal" style={{ color: C.ash }}>kcal</span></p>
                    {/* Never "per day" over the window — over the days that carried an estimate, and the
                        label says which, because that is the difference between an average and a lie. */}
                    <p className="font-mono text-[10px]" style={{ color: C.ashDim }}>{calFmt(cs.perDay.lo)}–{calFmt(cs.perDay.hi)} · over {cs.estDays} day{cs.estDays === 1 ? "" : "s"}</p>
                  </div>
                </div>

                {/* Coverage before the chart, not after it: the total above means one thing if it covers

                  <p className="font-mono text-lg font-bold" style={{ color: v ? C.gold : C.ashDim }}>{v ? v : "—"}<span className="ml-1 font-mono text-[11px] font-normal" style={{ color: C.ash }}>{v ? "min in zone" : ""}</span></p>
                  {when && <p className="font-mono text-[9px]" style={{ color: C.ashDim }}>{when}</p>}
                </div>
              ))}
            </div>
            {recs.longestSessionMin > 0 && <p className="mt-2 font-mono text-[10px]" style={{ color: C.ashDim }}>longest walk of any kind: {Math.round(recs.longestSessionMin)} min moving</p>}
            <p className={cap} style={{ color: C.ashDim }}>time in zone, not pace — on a treadmill holding your heart rate, a speed record would be a record set by the controller.</p>
          </div>
        </>
      )}

      {/* ── 8. Sessions ── the measured detail for the viewed day. */}
      {st && st.sessions.length > 0 && (
        <div className={card} style={{ background: C.card, borderColor: C.edge }}>
          <span className={hdr} style={{ color: C.ash }}>PadCoach sessions</span>
          <div className="mt-3 flex flex-col gap-2">
            {st.sessions.map((s, i) => {
              const key = s.id || String(i), open = openSess === key;
              // Task 60 — the two session-level metrics the survey says actually fit long steady work.
              // Both are null rather than 0 when the session cannot support them (no HR, under 20 min).
              const ef = sessionEF(s), dc = sessionDecoupling(s);
              // Wire key is `speedDriftPercent` — the PadCoach-inverted drift signal (falling required
              // speed at pinned heart rate), which is the number worth showing him in words.
              const drift = s.decoupling && s.decoupling.speedDriftPercent;
              const halves = s.decoupling && s.decoupling.firstHalfSpeedKmh != null && s.decoupling.secondHalfSpeedKmh != null
                ? `${s.decoupling.firstHalfSpeedKmh.toFixed(2)} → ${s.decoupling.secondHalfSpeedKmh.toFixed(2)} km/h` : null;
              return (
                <div key={key} className="flex flex-col gap-1 rounded-lg border px-3 py-2" style={{ borderColor: C.edge }}>
                  <div className="flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
                    <span className="font-mono text-[11px] font-bold" style={{ color: C.bone }}>{tHM(s.startedAt)}–{tHM(s.endedAt)}{s.bandName ? ` · ${s.bandName}` : ""}</span>
                    <span className="flex items-center gap-2">
                      {/* context is { tag, source }; an inherited "standingDefault" tag is an assumption,
                          not something he said about this session, so it is marked as one. */}
                      {s.context && <span className={sub} style={{ color: C.ash }}>{s.context.tag}{s.context.source === "standingDefault" ? " (default)" : ""}</span>}
                      {s.effort != null && <span className={sub} style={{ color: C.ash }}>rpe {s.effort}</span>}
                      <span className={sub} style={{ color: C.goldDim }}>measured</span>
                    </span>
                  </div>
                  <div className="flex flex-wrap items-center gap-x-3 gap-y-1 font-mono text-[10px]" style={{ color: C.ash }}>
                    <span>{s.distanceKm.toFixed(2)} km</span>
                    <span>{fmtHM(s.movingSec / 3600)}</span>
                    <span>{s.steps.toLocaleString()} steps</span>
                    {s.avgHr != null && <span>avg {Math.round(s.avgHr)} bpm</span>}
                    {s.maxHr != null && <span>max {Math.round(s.maxHr)} bpm</span>}
                    {s.inZonePct != null && <span style={{ color: C.sage }}>{Math.round(s.inZonePct)}% in zone</span>}
                    {s.avgSpeedKmh != null && <span>{s.avgSpeedKmh.toFixed(2)} km/h avg{s.speedSource === "derived" ? "*" : ""}</span>}
                    {/* never rendered as bare fact: an "assumed"/"unverified" grade says so inline. */}
                    {s.gradePercent != null && <span>{s.gradePercent.toFixed(2)}% grade{s.gradeSource && s.gradeSource !== "measured" ? ` (${s.gradeSource})` : ""}</span>}
                    {s.cadenceStepsPerMin != null && <span>{Math.round(s.cadenceStepsPerMin)} steps/min</span>}
                    {ef != null && <span style={{ color: C.ashDim }}>EF {ef.toFixed(3)}</span>}
                    {s.efficiencyRatio != null && <span style={{ color: C.ashDim }}>VO₂÷HR {s.efficiencyRatio.toFixed(3)}</span>}
                    {ef != null && <span style={{ color: C.ashDim }}>load {Math.round(sessionLoad(s))}</span>}
                    {/* Task 63 — "active" travels with every calorie figure on this tab, and so does
                        the band. A session with no estimate says why instead of showing nothing. */}
                    {s.cal && <span>≈{Math.round(s.cal.kcal)} kcal active ({Math.round(s.cal.lowKcal)}–{Math.round(s.cal.highKcal)}){s.movingSec > 0 ? ` · ${Math.round(s.cal.kcal / (s.movingSec / 3600))} kcal/h` : ""}</span>}
                    {!s.cal && <span style={{ color: C.ashDim }}>no calorie estimate{s.calUnavailableReason ? "" : " (missing grade or body weight)"}</span>}
                  </div>
                  {!s.cal && s.calUnavailableReason && <p className="font-mono text-[9px]" style={{ color: C.ashDim }}>{s.calUnavailableReason}</p>}
                  {/* Speed drift, in words. PadCoach pins heart rate, so aerobic drift shows up as the belt
                      slowing down — that sentence needs no threshold. The decoupling % is kept beside it as
                      a secondary figure with its own confidence, and deliberately gets no pass/fail badge:

                  {drift != null && (

                      {open && (
                        <div className="mt-1 flex flex-col gap-0.5">
                          {(() => { const mx = Math.max(...s.hrHistogram.map((b) => b.sec)) || 1; return s.hrHistogram.map((b, j) => {

                              </div>
                            ); }); })()}

                      )}
                    </>
                  )}
                </div>
              );
            })}
          </div>
          {st.sessions.some((s) => s.speedSource === "derived") && <p className={cap} style={{ color: C.ashDim }}>* average speed derived from distance ÷ moving time — PadCoach doesn't send a measured belt-speed average yet.</p>}
        </div>

      {/* ── Task 60 · Method ── Every metric on this tab, in one place, plus the famous ones this app

                ["% in zone", "Time in band ÷ moving time. An adherence figure: it says the controller held you where you asked, not that you got fitter. It should sit near a ceiling and is interesting when it drops."],

                ["Efficiency Factor", "Speed in metres per minute ÷ average heart rate — TrainingPeaks' own definition for walking. Speed, never pace. 20-minute steady-state floor. Not grade-adjusted."],
                ["Aerobic decoupling", "How much efficiency fell between the first and second half of a walk. Friel's bands: under 5% sound, 5–10% a moderate limitation, over 10% above your aerobic threshold. Under 20 minutes it is not valid and is not shown."],
                ["Training load", `Minutes × a zone weight (in band × ${ZONE_W_IN}, outside × ${ZONE_W_OUT}, above × ${ZONE_W_ABOVE}). Linear in duration on purpose.`],
                ["Fitness / fatigue / form", `Exponentially-weighted moving averages of that load on TrainingPeaks' ${CTL_TAU}-day and ${ATL_TAU}-day constants. Form is yesterday's fitness minus yesterday's fatigue, and per TrainingPeaks measures how adapted you are — not how you will perform.`],
                ["Projections", "A straight line fitted by least squares with Student's-t 95% intervals, which widen with distance from your data and with fewer readings. They report a range of dates, never a date."],
                ["Calories", "ACTIVE energy — what the walk cost on top of simply being alive — from PadCoach's ACSM equation (Pandolf when a vest is carried), with a Keytel heart-rate cross-check. Always shown as a band. ±20% on the equation itself, widened in quadrature by the uncertainty of the upper-body-support correction — which rests on two studies of n = 10 and n = 13, and which grows with grade because it applies to the grade term: ±20% on the flat, about ±23% at your 8.75%. The Calories card reads the real fraction back off each figure's own bounds rather than assuming it. Every other app shows a bare integer it cannot justify. A day PadCoach could not estimate is counted as a blank on the Calories card and never rendered as zero."],
              ].map(([k, v]) => (
                <p key={k}><span style={{ color: C.bone }}>{k}</span> — {v}</p>
              ))}
            </div>
            <p className={`mt-4 ${sub}`} style={{ color: C.ashDim }}>what this app will not compute, and why</p>
            <div className="mt-2 flex flex-col gap-2 font-mono text-[10px] leading-relaxed" style={{ color: C.ashDim }}>

      {/* ── 9. Manual entries — an activity PadCoach never saw. Always tagged, never merged into the

      <div className={card} style={{ background: C.card, borderColor: C.edge }}>
        <span className={hdr} style={{ color: C.ash }}>Manual entry</span>

        <div className="mt-3 flex flex-wrap items-end gap-3">

          </div>
          <div className="flex flex-col gap-1">
            <label className={sub} style={{ color: C.ashDim }}>steps</label>
            <NumberField value={form.steps} step={500} label="steps" width={72} onChange={(n) => setForm((f) => ({ ...f, steps: n }))} />
          </div>
          <button onClick={async () => {
            if (!form.durationMin && !form.distanceKm && !form.steps) { flash("Enter at least one of duration/distance/steps"); return; }
            await addManualCardio(viewDate, form); resetForm(); flash("Logged");
          }} className="rounded-full px-4 py-2 font-mono text-[11px] font-bold uppercase tracking-wider active:scale-95" style={{ background: C.gold, color: C.bg }}>Add</button>
        </div>

        {manual.length > 0 && (
          <div className="mt-4 flex flex-col gap-2">

              <div key={mm.id} className="flex items-center justify-between rounded-lg border px-3 py-2" style={{ borderColor: C.edge }}>

                  {mm.distanceKm > 0 && <span>{mm.distanceKm.toFixed(2)} km</span>}

              </div>

      {/* ── 10. PadCoach sync — plumbing, demoted to the bottom now that Task 51 made the import
          automatic. Both "last happened" lines stay visible; only the file picker is folded away. */}
      <div className={card} style={{ background: C.card, borderColor: C.edge }}>
        <span className={hdr} style={{ color: C.ash }}><Activity size={12} style={{ display: "inline", marginRight: 6, color: C.gold }} />PadCoach sync</span>
        {cardio.lastAutoSyncAt && <p className="mt-2 font-mono text-[9px]" style={{ color: C.ashDim }}>auto-synced from PadCoach {new Date(cardio.lastAutoSyncAt).toLocaleString()}</p>}
        {cardio.lastImportAt && <p className="mt-1 font-mono text-[9px]" style={{ color: C.ashDim }}>last manual import {new Date(cardio.lastImportAt).toLocaleString()}</p>}
        {!cardio.lastAutoSyncAt && !cardio.lastImportAt && <p className="mt-2 font-mono text-[9px]" style={{ color: C.ashDim }}>nothing has arrived from PadCoach yet.</p>}
        <button onClick={() => setSyncOpen((v) => !v)} className={`mt-2 ${sub}`} style={{ color: C.goldDim }}>{syncOpen ? "▾ hide" : "▸ import a file by hand"}</button>
        {syncOpen && (
          <div className="mt-3">
            <p className="font-mono text-[9px]" style={{ color: C.ashDim }}>Cardio syncs on its own through your private repo. This is the manual fallback — the file PadCoach writes at Dashboard → Settings → "Export for Coach App".</p>
            <div className="mt-3 flex items-center gap-3">
              <label className="inline-flex cursor-pointer items-center gap-2 rounded-full border px-4 py-2 font-mono text-[11px] uppercase tracking-wider active:scale-95" style={{ borderColor: C.goldDim, color: C.gold }}>
                Import PadCoach export…
                <input type="file" accept="application/json" className="hidden" onChange={async (e) => {
                  const file = e.target.files && e.target.files[0]; e.target.value = "";
                  if (!file) return;
                  try {
                    const json = JSON.parse(await file.text());

        {toast && <p className="mt-2 font-mono text-[10px]" style={{ color: C.sage }}>{toast}</p>}
      </div>
    </>
  );
}
// ReviewDay: an equipment-prep glance at the whole day's plan — one row per plan item (not per unit),
// work prescription only (no cues/descriptions). Tap a row to jump the pager to its unit and close.
function ReviewDay({ plan, units, mem, unit, done, bars, onClose, onJump }) {
  const row = (exIdx, isPairB) => {
    const item = plan[exIdx];
    const workIdxs = item.sets.map((s, si) => ({ s, si })).filter((x) => x.s.kind === "work");
    const nSets = workIdxs.length;
    const first = workIdxs[0]?.s;
    const [bot, top] = first?.range || [null, null];
    const dbs = dbCount(mem, item.ex);
    const allDone = nSets > 0 && workIdxs.every((x) => done.has(`${exIdx}-${x.si}`));
    const unitIdx = units.findIndex((u) => u.idxs.includes(exIdx));
    const rx = !first ? "" : item.ex.repProgress
      ? `${nSets} × (${bot}–${top})`
      : `${nSets} × ${dispW(first.load, unit)}${uw(unit)}${dbs === 2 ? "/hand" : ""} (${bot}–${top})${dbs === 1 ? " · 1 DB" : ""}`;
    return (
      <button key={exIdx} onClick={() => onJump(unitIdx)} className="flex min-h-[44px] w-full items-center gap-2 py-2 text-left active:opacity-70">
        <span className="flex w-4 shrink-0 items-center justify-center">{allDone && <Check size={13} style={{ color: C.sage }} />}</span>
        <span className="font-mono text-xs shrink-0" style={{ color: C.gold }}>{String(exIdx + 1).padStart(2, "0")}</span>
        <span className="min-w-0 flex-1 truncate text-[13px]" style={{ color: C.bone }}>
          {isPairB && <span style={{ color: C.gold }}>× </span>}{item.ex.name}
        </span>
        <span className="shrink-0 font-mono text-[11px]" style={{ color: C.ash }}>{rx}</span>
      </button>
    );
  };
  const rows = [];
  for (let i = 0; i < plan.length; i++) {
    const item = plan[i];
    if (item.pair && item.pair.role === "B") continue;   // rendered together with its A partner
    if (item.pair && item.pair.role === "A" && item.pair.partnerIdx === i + 1) {
      rows.push(
        <div key={`pair-${i}`} style={{ borderLeft: `2px solid ${C.goldDim}`, paddingLeft: 8, marginLeft: -2 }}>
          {row(i, false)}
          {row(item.pair.partnerIdx, true)}
        </div>
      );
    } else rows.push(row(i, false));
  }
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center" style={{ background: "rgba(0,0,0,0.72)" }} onClick={onClose}>
      <div className="max-h-[92vh] w-full max-w-md overflow-y-auto rounded-t-2xl border p-5 sm:rounded-2xl" style={{ background: C.card, borderColor: C.edge }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-3">
          <div>
            <h3 className="text-[15px] font-bold leading-tight" style={{ color: C.bone }}>Review day</h3>
            <p className="mt-0.5 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>{plan.length} exercises · equipment prep</p>
            {bars > 0 && <p className="mt-0.5 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>bands: {bars} bars · {bars * 200} g/arm</p>}
          </div>
          <button onClick={onClose} aria-label="close" className="-my-2 -mr-2 flex h-11 w-11 shrink-0 items-center justify-center active:scale-90" style={{ color: C.ash }}><X size={18} /></button>
        </div>
        <div className="mt-3 space-y-1">
          {rows}
        </div>
      </div>
    </div>
  );
}

// per-exercise dumbbell-count toggle (Task 7): two 44px icon buttons — one Dumbbell glyph = 1 DB,
// two overlapped glyphs = 2 DB. Active state gold, inactive ash; shared by renderSetRow and
// renderPairStripCol so both render paths stay pixel-identical. `disabled` preserves the existing
// mid-session lock (weight-per-hand math can't shift once a session is underway).
function DbToggle({ count, onSet, disabled }) {
  const seg = (n, active) => (
    <button key={n} onClick={() => onSet(n)} aria-label={n === 1 ? "use one dumbbell" : "use two dumbbells"}
      disabled={disabled} title={disabled ? "finish or reset the session to switch" : undefined}
      className="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-full border px-2.5 active:scale-95"
      style={{ borderColor: active ? C.gold : C.edge, color: active ? C.gold : C.ash, opacity: disabled ? 0.45 : 1 }}>
      <Dumbbell size={16} />
      {n === 2 && <span style={{ marginLeft: -8, opacity: 0.9 }}><Dumbbell size={16} /></span>}
    </button>
  );
  return <div className="flex items-center gap-1.5">{seg(1, count === 1)}{seg(2, count === 2)}</div>;
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [mem, setMem] = useState(DEFAULT);
  const [day, setDay] = useState(1);
  const [tab, setTabState] = useState(() => { try { return localStorage.getItem("gg:tab") || "workout"; } catch (e) { return "workout"; } });
  const setTab = (t) => { setTabState(t); try { localStorage.setItem("gg:tab", t); } catch (e) {} };   // remembered per device, not synced
  const [sync, setSync] = useState(null);          // {url,key,code} or null
  const [syncMsg, setSyncMsg] = useState("");       // human-readable status
  const [syncLocked, setSyncLocked] = useState(CIPHER_ACTIVE);   // baked sync waiting for the password on this device
  const [syncLog, setSyncLog] = useState([]);       // verbose, on-screen debug log
  const pushTimer = useRef(null);
  const memRef = useRef(DEFAULT);
  const liveRef = useRef(null);
  const shaRef = useRef(null);
  const syncReady = useRef(false);
  const reconciling = useRef(false);   // serialize pull/push so they can't race each other
  const quietRef = useRef(0);   // suppress push echoes right after adopting a remote copy
  const liveClearedRef = useRef(false);   // true only when WE intentionally ended the session (finish/discard/day-switch)
  const syncedLiveSig = useRef("null");   // signature of the live session as last synced — stops re-pushing an adopted session
  const lastFinishRef = useRef(null);     // { key, at } of the most recently finished set — used to measure REAL rest taken

  // mirror the module-level sync debug ring buffer into React state so it renders

  // log every item of a meal onto day dk (one entry per item, each with its own timestamp + scaled nutr) — single persist
  const logMeal = async (mealId, dk) => updateMem((prev) => { const nut = nutFrom(prev), k = dk || todayKey(), d = dayOf(nut, k); const m = (nut.meals || []).find((x) => x.id === mealId); if (!m) return prev;

  // clone all FOOD entries from one day into another (fresh ids/timestamps); leaves steps/water/sleep untouched — single persist
  const copyDay = async (fromKey, toKey) => updateMem((prev, ret) => { const nut = nutFrom(prev); const from = dayOf(nut, fromKey), to = dayOf(nut, toKey); if (!from.entries.length) { ret(0); return prev; }

  const removeEntry = async (id, dk) => updateMem((prev) => { const nut = nutFrom(prev), k = dk || todayKey(), d = dayOf(nut, k); if (!d.entries.some((x) => x.id === id)) return prev;

  const addFood = async (food) => updateMem((prev) => { const nut = nutFrom(prev); const f = { id: uid(), label: food.label, basis: "item", basisGrams: null, nutr: { kcal: +food.kcal || 0, protein: +food.protein || 0, carbs: +food.carbs || 0, fat: +food.fat || 0 }, source: "custom" };
    return withNut(prev, { ...nut, foods: [...(nut.foods || []), f] }); });
  const removeFood = async (id) => updateMem((prev) => { const nut = nutFrom(prev); return withNut(prev, { ...nut, foods: (nut.foods || []).filter((f) => f.id !== id) }); });
  const setSteps = async (n, dk) => updateMem((prev) => { const nut = nutFrom(prev), k = dk || todayKey(), d = dayOf(nut, k); const nd = { ...d, steps: Math.max(0, Math.round(+n || 0)) };

  const removeWaterEntry = async (id, dk) => updateMem((prev) => { const nut = nutFrom(prev), k = dk || todayKey(), d = dayOf(nut, k); const e = d.waterEntries.find((x) => x.id === id); if (!e) return prev;

    return withNut(prev, { ...nut, days: { ...nut.days, [k]: nd } }); });
  const setSleepToday = async (bed, wake, dk) => updateMem((prev) => { const sl = prev.sleep || DEFAULT.sleep, k = dk || todayKey();

  const setSleepDefault = async (bed, wake) => updateMem((prev) => { const sl = prev.sleep || DEFAULT.sleep; return { ...prev, sleep: { ...sl, def: { bed, wake } } }; });
  const logBW = async () => {
    const body = { ...(mem.body || {}) };
    if (!body.bw) return;
    const today = new Date().toISOString().slice(0, 10);
    const hist = (body.bwHist || []).filter((e) => e.t.slice(0, 10) !== today);

  const resetMemory = async () => { if (hasStore) { await clearState(); await clearLive(); } setMem(migrateMem(null)); setDay(1); setSummary(null); setPending(null); setConfirm(null); };

  const body = mem.body || {};
  const unit = mem.unit || "lb";
  const bw = body.bw || 0;
  const bwHist = body.bwHist || [];
  const bwDelta = (() => {

    const last = bwHist[bwHist.length - 1].w;
    const cutoff = Date.now() - 30 * 864e5;
    const prior = [...bwHist].reverse().find((e) => new Date(e.t).getTime() <= cutoff) || bwHist[0];

  })();
  const stdRows = STD.map((s) => {
    const ex = ALL_EX.find((e) => e.name === s.name);

    const bestE = hist.length ? Math.max(...hist.map((h) => e1rm(h.w, h.r))) : (ex ? e1rm(mem.weights?.[s.name] ?? baseWeight(ex), 5) : 0);
    const pair = fiveRM(bestE) * 2;
    const ratio = bw ? pair / bw : 0;
    let tier = -1; s.ratios.forEach((r, i) => { if (ratio >= r) tier = i; });
    const nextIdx = Math.min(tier + 1, 2);
    const top = tier >= 2;
    const prevRatio = tier >= 0 ? s.ratios[tier] : 0;
    const nextRatio = s.ratios[nextIdx];
    const prog = top ? 1 : Math.max(0, Math.min(1, (ratio - prevRatio) / (nextRatio - prevRatio)));
    const nextTargetPair = Math.round((bw ? nextRatio * bw : 0));

  });
  const waistPct = body.waist && body.height ? body.waist / body.height : 0;

  // one exercise-unit card — shared by the pre-session flat list and the in-session focus pager.
  // Reads active/rest/done/logs/openInfo LIVE (it's a plain closure recreated every render, not memoized),

        <div className="flex-1">

            {chg && chg.toLoad !== chg.fromLoad && (

                {chg.toLoad > chg.fromLoad ? <TrendingUp size={10} /> : <TrendingDown size={10} />} {dispW(chg.toLoad, unit)}{chg.single ? ` ${uw(unit)}` : `${uw(unit)}/hand`} (was {dispW(chg.fromLoad, unit)})
              </span>
