// Task 59 — the OTHER half of a schema-2 payload: the top-level `analytics` block
// (`CoachExportAnalytics`), normalized. Deliberately separate from cleanCardioDays, because these are
// whole-history trends PadCoach recomputes from scratch on every export — they belong to the payload,
// not to any one day, which is also what keeps them clear of CARDIO_DAY_CAP.
//
// Shape, verified against CoachExportAnalytics.swift rather than guessed:
//   analytics.zoneName                                             — the band every zone figure is for
//   analytics.efficiency        { readings[{day,ratio}], rolling[{day,average}], direction, confidence }
//   analytics.hrv               { readings[{day,rmssdMs,sdnnMs,artifactRate}], rollingShort[], rollingLong[],
//                                 latestShortMs, latestLongMs, confidence }
//   analytics.restingHeartRate  { readings[{day,bpm,source}], rolling[{day,average}], latestRollingBPM, confidence }
//   analytics.timeInZone        { weeks[{weekStart,minutes,sessionCount,byBand}], confidence }
//   analytics.volume            { goalMinutes, targetMinutes, anchorMinutes, increaseWithheld,
//                                 holdReason, holdMessage, projectedDaysToGoal, projectedDate }
// Note the series are ARRAYS carrying a "YYYY-MM-DD" `day`/`weekStart` string — not objects keyed by day.
// Returns null for a schema-1 payload (his live data until he installs the new PadCoach build), which is
// the whole reason nothing downstream may assume this exists.
const cleanCardioAnalytics = (json) => {
  const a = json && typeof json === "object" && json.analytics && typeof json.analytics === "object" ? json.analytics : null;
  if (!a) return null;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const str = (v) => (typeof v === "string" && v ? v : null);
  const day = (v) => (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null);
  // One day-keyed series → [{ day, v }]. `key` names the value field on the wire, which differs per series
  // (`ratio`, `average`, `bpm`, `rmssdMs`) — pinning it here is the point.
  const series = (arr, key) => (Array.isArray(arr) ? arr.map((p) => {
    if (!p || typeof p !== "object" || !day(p.day) || num(p[key]) == null) return null;
    const out = { day: p.day, v: num(p[key]) };
    if (str(p.source)) out.source = str(p.source);
    return out;
  }).filter(Boolean) : []);
  const sub = (key) => (a[key] && typeof a[key] === "object" ? a[key] : null);
  const eff = sub("efficiency"), hrv = sub("hrv"), rhr = sub("restingHeartRate"), tiz = sub("timeInZone"), vol = sub("volume");
  return {
    zoneName: str(a.zoneName),
    efficiency: eff ? { readings: series(eff.readings, "ratio"), rolling: series(eff.rolling, "average"),
      direction: str(eff.direction), confidence: cConf(eff.confidence) } : null,
    hrv: hrv ? { readings: series(hrv.readings, "rmssdMs"), rollingShort: series(hrv.rollingShort, "average"),
      rollingLong: series(hrv.rollingLong, "average"), latestShortMs: num(hrv.latestShortMs),
      latestLongMs: num(hrv.latestLongMs), confidence: cConf(hrv.confidence) } : null,
    restingHeartRate: rhr ? { readings: series(rhr.readings, "bpm"), rolling: series(rhr.rolling, "average"),
      latestRollingBPM: num(rhr.latestRollingBPM), confidence: cConf(rhr.confidence) } : null,
    timeInZone: tiz ? { weeks: (Array.isArray(tiz.weeks) ? tiz.weeks : []).map((w) => (w && typeof w === "object" && day(w.weekStart)
        ? { weekStart: w.weekStart, minutes: num(w.minutes) || 0, sessionCount: num(w.sessionCount) || 0,
            byBand: w.byBand && typeof w.byBand === "object" ? w.byBand : {} } : null)).filter(Boolean),
      confidence: cConf(tiz.confidence) } : null,
    // A day under target is DATA, not failure (VolumeProgression's own rule) — `holdMessage` is written to
    // be shown verbatim and must never be rendered in red.
    volume: vol ? { goalMinutes: num(vol.goalMinutes), targetMinutes: num(vol.targetMinutes),
      anchorMinutes: num(vol.anchorMinutes), increaseWithheld: vol.increaseWithheld === true,
      holdReason: str(vol.holdReason), holdMessage: str(vol.holdMessage),
      projectedDaysToGoal: num(vol.projectedDaysToGoal), projectedDate: day(vol.projectedDate) } : null,
  };
};

/* ───────────────────── cardio analytics (Task 57) ─────────────────────
   Pure selectors over cardio.days, behind every card on the Cardio tab and covered directly by
   tests/run-tests.mjs. Three rules run through all of them, worth stating once rather than at each:

   • SPARSE FIRST. He has one real walk. Everything here has to say something true after a single
     session — so nothing below waits on a long history, and the few figures that genuinely do need
     one (trend directions) come back null WITH the reason, never as a confident-looking zero.
   • NEVER INVENT. A day with no cardio is a 0 for a VOLUME (minutes, steps, km) and a null for a
     RATE (avg HR, speed, % in zone). Walking zero minutes is a fact; having a zero heart rate is not.
   • EVERY NEW EXPORT FIELD IS OPTIONAL. PadCoach's payload is widening (avg speed, grade, efficiency,
     decoupling, HRV, resting HR, volume target, confidence grades, context tags). Until he installs
     that build his live data carries none of it, so every reader degrades to what really arrived. */

const Z2_LO = 125, Z2_HI = 135, Z2_MID = 130;      // his real measured band, not an age-guessed one
const WHO_WEEK_MIN = 150;                          // WHO's 150 moderate min/week floor (Garmin's Intensity Minutes goal)
const TREND_FLOOR = 6;                             // PadCoach's TrendDataFloor rule: five or fewer readings is not a trend
const TREND_DEADBAND = 0.03;                       // EfficiencyTrend's own 3% before anything is called a change
const cNum = (v) => (typeof v === "number" && isFinite(v) ? v : null);
const cPos = (v) => { const n = cNum(v); return n != null && n > 0 ? n : null; };
// PadCoach's `CoachExportConfidence` on the wire is { level, reason, trendworthy } — `level` is the key it
// really emits, `reason` is a sentence written to be shown verbatim, and `trendworthy` is PRECOMPUTED
// upstream exactly so this app can never invent its own threshold for when a number becomes a verdict.
// A bare string ("high") is still honoured for a hand-written fixture; anything else counts as "no grade
// was sent", which is never silently treated as a pass.
const cConf = (c) => {
  const tw = (g) => g === "moderate" || g === "high";
  if (typeof c === "string" && c) return { grade: c, reason: null, trendworthy: tw(c) };
  if (c && typeof c === "object") {
    const g = c.level || c.grade || c.confidence;
    if (!g) return null;
    const grade = String(g);
    return { grade, reason: typeof c.reason === "string" && c.reason ? c.reason : null,
      trendworthy: typeof c.trendworthy === "boolean" ? c.trendworthy : tw(grade) };
  }
  return null;
};
const confOk = (c) => !!c && c.trendworthy === true;   // PadCoach's own gate; insufficient/low never earn a verdict

/* ───────────────── calories (Task 63) ─────────────────
   One normalizer, and three facts about this number that every card below is built around.

   1. `kcal` IS ACTIVE ENERGY, NOT GROSS. PadCoach's Task 58 subtracted the resting term that both
      underlying equations carry (ACSM's leading 3.5, Pandolf's leading 1.5·W) — about 148 kcal of a
      95-minute walk, a fifth of the gross figure, and a fifth he spends sitting at the same desk doing
      nothing. It did so *because this number leaves the app*: added to a day that already accounts for
      basal expenditure, a gross figure double-counts silently. So every surface here says "active",
      and gross is never reconstructed from a resting rate this app does not have (see
      CARDIO_NOT_COMPUTED). If PadCoach ever sends `grossKcal`/`restingKcal`, they are read and shown
      as their own figures — labelled, never swapped in for the active one.

   2. THE BAND IS PART OF THE NUMBER. PadCoach builds it from a ±20% model error (±35% under 3 km/h,
      its own validated floor) combined in quadrature with the uncertainty of the upper-body-support
      correction — which rests on two studies of n = 10 and n = 13, one of them not statistically
      significant. That lands around ±23% for his desk walking. A point value drawn alone would
      misrepresent what is known, so nothing here renders kcal without its band. The percentage is
      RECOVERED from the two bounds rather than assumed, because the fraction PadCoach used depends on
      speed and on the support setting and is not on the wire.

   3. ABSENT IS NULL, NEVER ZERO. A manual entry has no heart rate and therefore no calorie model at
      all; a session missing grade or body weight gets nothing from PadCoach on purpose; and his older
      synced days carry none until PadCoach re-exports them. All three are gaps, and a gap that renders
      as 0 is a lie that also sinks every average it touches. */
const cardioCalorie = (c) => {
  if (!c || typeof c !== "object") return null;
  const kcal = cPos(c.kcal);
  if (kcal == null) return null;                       // 0 kcal is not an estimate, it is an absent one
  const lo = cPos(c.lowKcal), hi = cPos(c.highKcal);
  const banded = lo != null && hi != null && hi > lo;
  const resting = cNum(c.restingKcal);
  const gross = cPos(c.grossKcal) != null ? cPos(c.grossKcal) : resting != null && resting >= 0 ? kcal + resting : null;
  return {
    kcal, lowKcal: banded ? lo : kcal, highKcal: banded ? hi : kcal, banded,
    // ±% of the point value. Half the band width, so "±23%" means the same thing it means upstream.
    bandPct: banded ? ((hi - lo) / 2 / kcal) * 100 : null,
    model: typeof c.model === "string" && c.model ? c.model : null,
    // NOT SENT YET, all four — present on PadCoach's own CalorieEstimate but absent from
    // CoachExportCalorie. Read anyway so the card lights up by itself the day they cross the wire.
    grossKcal: gross, restingKcal: resting != null && resting >= 0 ? resting : null,
    hrCrossCheckKcal: cPos(c.hrCrossCheckKcal),
    belowValidatedSpeedFloor: c.belowValidatedSpeedFloor === true,
    supportReductionFraction: cPos(c.supportReductionFraction),
  };
};

// One PadCoach session, normalized. avgSpeedKmh is the interesting one: PadCoach's own figure when the
// export carries it, otherwise derived from distance ÷ moving time — two fields it has always sent. The
// source is kept so the UI can say "derived" rather than imply a measured belt-speed average.
const cardioSession = (s) => {
  if (!s || typeof s !== "object") return null;
  const movingSec = cPos(s.movingTimeSec) || 0;
  const distanceKm = cPos(s.distanceKm) || 0;
  const exported = cPos(s.avgSpeedKmh);
  const derived = movingSec > 0 && distanceKm > 0 ? distanceKm / (movingSec / 3600) : null;
  const inZoneSec = cPos(s.timeInZoneSec) || 0;
  const dec = s.decoupling && typeof s.decoupling === "object" ? s.decoupling : null;
  // Session context is an OBJECT on the wire — `CoachExportSessionContext { tag, source }` — not the bare
  // string this reader first guessed at, which silently hid every tag. `source` carries its own weight:
  // "tagged" is something he said about THIS session, "standingDefault" was inherited from a default he
  // set once, and an inherited tag is an assumption, not a statement.
  const ctx = s.context && typeof s.context === "object" && typeof s.context.tag === "string" && s.context.tag
    ? { tag: s.context.tag, source: typeof s.context.source === "string" && s.context.source ? s.context.source : null }
    : typeof s.context === "string" && s.context ? { tag: s.context, source: null } : null;
  // CADENCE UNITS — settled in Task 59, deliberately BEFORE the field exists, because the ambiguity is
  // the whole bug. The strap reports STRIDES per minute; PadCoach's StepAccumulator doubles that to
  // STEPS. A bare "spm" would read ~53 where he expects ~106 and nothing on screen would say which. So
  // this app reads only self-describing names, and always shows STEPS per minute:
  //   avgCadenceStepsPerMin    — steps/min, taken as-is
  //   avgCadenceStridesPerMin  — strides/min, DOUBLED here to steps/min
  // A bare `avgCadenceSpm` is deliberately NOT read: an ambiguous number is worse than a blank.
  // Nothing sends any of these today (CoachExport.swift has no cadence at all) — cadence reads
  // "not sent yet" until PadCoach picks one of the two names above.
  const cadSteps = cPos(s.avgCadenceStepsPerMin), cadStrides = cPos(s.avgCadenceStridesPerMin);
  // NOT SENT YET: no heart-rate histogram is in the schema-2 export — the export author deferred it as a
  // genuinely new computation. The reader stays so the card lights up by itself the day it arrives.
  const hist = Array.isArray(s.hrHistogram)
    ? s.hrHistogram.map((b) => ({ lo: cNum(b && (b.lo != null ? b.lo : b.from != null ? b.from : b.bpm)), hi: cNum(b && (b.hi != null ? b.hi : b.to)), sec: cPos(b && (b.sec != null ? b.sec : b.seconds)) || 0 })).filter((b) => b.lo != null)
    : null;
  return {
    id: s.id || null, startedAt: s.startedAt || null, endedAt: s.endedAt || null,
    movingSec, distanceKm, steps: cPos(s.totalSteps) || 0,
    avgHr: cPos(s.avgHeartRate), maxHr: cPos(s.maxHeartRate),
    inZoneSec, inZonePct: movingSec > 0 && inZoneSec > 0 ? (inZoneSec / movingSec) * 100 : null,
    avgSpeedKmh: exported != null ? exported : derived,
    speedSource: exported != null ? "measured" : derived != null ? "derived" : null,
    maxSpeedKmh: cPos(s.maxSpeedKmh),
    gradePercent: cNum(s.gradePercent),
    // "measured" / "assumed" / "unverified" — read BEFORE rendering gradePercent as fact. He measured the
    // TP8's max at 5° (8.75%); the middle position was never checked, and older sessions carry a grade
    // from a superseded product listing.
    gradeSource: typeof s.gradeSource === "string" && s.gradeSource ? s.gradeSource : null,
    cadenceStepsPerMin: cadSteps != null ? cadSteps : cadStrides != null ? cadStrides * 2 : null,
    bandName: s.bandName || null, bandLow: cPos(s.bandLowerBPM), bandHigh: cPos(s.bandUpperBPM),
    calorie: s.calorie && typeof s.calorie === "object" ? s.calorie : null,
    // Task 63 — the same block, normalized: band recovered, active/gross kept apart, 0 read as absent.
    cal: cardioCalorie(s.calorie),
    // Why this session has no calorie BECAUSE OF WHAT IT IS rather than because an input was missing —
    // PadCoach attaches this to a ride (the walking equations do not apply) and never to a walk. Shown
    // verbatim, so "no estimate" can say which kind of no.
    calUnavailableReason: typeof s.calorieUnavailableReason === "string" && s.calorieUnavailableReason ? s.calorieUnavailableReason : null,
    context: ctx,
    // NOT SENT YET: PadCoach records no RPE. Kept so the row fills itself in if it ever does.
    effort: cPos(s.perceivedEffort), hrHistogram: hist && hist.length ? hist : null,
    // `efficiencyRatio` is a BARE NUMBER on the wire (ACSM VO2 ÷ avg HR for this one session) — it carries
    // no direction and no confidence of its own, and is never diagnostic alone. The trustworthy reading
    // is analytics.efficiency, which is where direction and confidence actually live.
    efficiencyRatio: cPos(s.efficiencyRatio),
    // Wire keys are `speedDriftPercent` / `hrDriftPercent`, and the two half-speeds come across too — so
    // the drift sentence can name the actual km/h instead of only a percentage.
    // Task 60 — the two half AVERAGE HEART RATES come across too, and are now read: with both
    // half-speeds AND both half-HRs, Friel's decoupling can be recomputed here from primitives
    // (EF = speed ÷ HR per half) instead of inferring the sign convention of `percent`.
    decoupling: dec ? { percent: cNum(dec.percent), speedDriftPercent: cNum(dec.speedDriftPercent),
      hrDriftPercent: cNum(dec.hrDriftPercent), firstHalfSpeedKmh: cPos(dec.firstHalfSpeedKmh),
      secondHalfSpeedKmh: cPos(dec.secondHalfSpeedKmh), firstHalfAvgHeartRate: cPos(dec.firstHalfAvgHeartRate),
      secondHalfAvgHeartRate: cPos(dec.secondHalfAvgHeartRate), confidence: cConf(dec.confidence) } : null,
  };
};
// A session counts toward "speed at 130 bpm" only if its own average heart rate actually LANDED in the
// band — like for like, with no model and no adjustment. A walk that averaged 118 bpm is simply left out
// rather than scaled up to pretend it was a zone-2 walk.
const inBandSession = (s) => !!s && s.avgHr != null && s.avgSpeedKmh != null
  && s.avgHr >= (s.bandLow || Z2_LO) && s.avgHr <= (s.bandHigh || Z2_HI);

// One day, normalized: PadCoach's measured figures plus any manual entries, kept summable but never
// blended where the sources disagree about what they know (zone-2 min and kcal stay PadCoach-only —
// a manual walk has no heart rate, so padding them with a guess would be a lie).
const cardioDay = (d) => {
  if (!d || typeof d !== "object") return null;
  const sessions = (Array.isArray(d.sessions) ? d.sessions : []).map(cardioSession).filter(Boolean);
  const manual = Array.isArray(d.manual) ? d.manual : [];
  const steps = (cPos(d.steps) || 0) + manual.reduce((a, m) => a + (cPos(m.steps) || 0), 0);
  const distanceKm = (cPos(d.distanceKm) || 0) + manual.reduce((a, m) => a + (cPos(m.distanceKm) || 0), 0);
  const movingSec = (cPos(d.movingTimeSec) || 0) + manual.reduce((a, m) => a + (cPos(m.durationSec) || 0), 0);
  const measuredSec = sessions.reduce((a, s) => a + s.movingSec, 0);
  const inZoneSec = sessions.reduce((a, s) => a + s.inZoneSec, 0);
  const hrW = sessions.filter((s) => s.avgHr != null && s.movingSec > 0);
  const bandS = sessions.filter(inBandSession);
  // Task 63 — the day's calorie figure is PadCoach's own (CoachExportDay.calorie), which is what its
  // dashboard shows; taking it verbatim is what stops this app quietly disagreeing with PadCoach for
  // the same day. The MOVING TIME AND DISTANCE BEHIND IT, though, come from the sessions that actually
  // produced an estimate — not from the whole day. A day that mixes a measured walk with a manual
  // entry would otherwise divide real calories by an hour that never had a calorie model applied to
  // it, and report a kcal/h that is simply too low.
  const cal = cardioCalorie(d.calorie);
  const calS = sessions.filter((s) => s.cal);
  const calSec = calS.reduce((a, s) => a + s.movingSec, 0);
  const calKm = calS.reduce((a, s) => a + s.distanceKm, 0);
  const sessKm = sessions.reduce((a, s) => a + s.distanceKm, 0);
  return {
    steps, distanceKm, movingSec, measuredSec, inZoneSec, sessions, manual,
    zone2Min: cPos(d.zone2Min),                                     // PadCoach only — null, not 0, when it sent none
    kcal: cal ? cal.kcal : null,
    calorie: d.calorie && typeof d.calorie === "object" ? d.calorie : null,
    cal,                                                            // normalized: band, model, active/gross kept apart
    // Seconds and km behind the estimate — see the note above. 0 when there is no estimate at all, so a
    // rate divides by nothing rather than by a denominator with no numerator.
    calSec: cal ? (calSec > 0 ? calSec : measuredSec) : 0,
    calKm: cal ? (calKm > 0 ? calKm : sessKm) : 0,
    calSessions: calS.length,
    calMissingSessions: sessions.filter((s) => !s.cal).length,
    // A PARTIAL day: PadCoach counted working minutes it has no calorie model for (a ride). The day's
    // total is then an undercount and must never be drawn as a complete one.
    calOmitted: Array.isArray(d.calorieOmittedModalities) && d.calorieOmittedModalities.length
      ? { modalities: d.calorieOmittedModalities, reason: typeof d.calorieOmittedReason === "string" && d.calorieOmittedReason ? d.calorieOmittedReason : null } : null,
    // PadCoach's OWN day figure wins when it sends one (CoachExportDay.avgHeartRate/maxHeartRate) — it is
    // time-weighted across the day upstream, so taking it verbatim is what stops this app quietly
    // disagreeing with PadCoach's dashboard for the same day. Falls back to the session-weighted average
    // this app has always computed, which is all a schema-1 payload allows.
    avgHr: cPos(d.avgHeartRate) != null ? cPos(d.avgHeartRate)
      : hrW.length ? hrW.reduce((a, s) => a + s.avgHr * s.movingSec, 0) / hrW.reduce((a, s) => a + s.movingSec, 0) : null,
    avgHrSource: cPos(d.avgHeartRate) != null ? "padcoach" : hrW.length ? "derived" : null,
    maxHr: cPos(d.maxHeartRate) != null ? cPos(d.maxHeartRate)
      : sessions.reduce((a, s) => (s.maxHr != null && s.maxHr > a ? s.maxHr : a), 0) || null,
    inZonePct: measuredSec > 0 && inZoneSec > 0 ? (inZoneSec / measuredSec) * 100 : null,
    speedAtZone: bandS.length ? bandS.reduce((a, s) => a + s.avgSpeedKmh * s.movingSec, 0) / bandS.reduce((a, s) => a + s.movingSec, 0) : null,
    bandSessions: bandS.length,
    // Resting HR is from the seated pre-walk baseline, NEVER from the walk. `restingSource` says
    // "measured" / "manual" / "mixed" and is present exactly when restingBPM is.
    restingBPM: cPos(d.restingBPM),
    restingSource: typeof d.restingSource === "string" && d.restingSource ? d.restingSource : null,
    hrv: d.hrv && typeof d.hrv === "object" ? { rmssdMs: cPos(d.hrv.rmssdMs), sdnnMs: cPos(d.hrv.sdnnMs),
      artifactRate: cNum(d.hrv.artifactRate),
      // "good" / "usableWithCaveat" — a rejected capture never produces a reading at all, so this is
      // never a way of saying "bad data got through".
      quality: typeof d.hrv.quality === "string" && d.hrv.quality ? d.hrv.quality : null } : null,
    walked: steps > 0 || distanceKm > 0 || movingSec > 0 || sessions.length > 0 || manual.length > 0,
  };
};

// n calendar days ending at endKey, oldest → newest. Days he never walked are present with a null stat,
// so a chart draws a real gap in the habit rather than quietly closing it up.
const cardioWindow = (days, endKey, n) => [...Array(n)].map((_, i) => {
  const key = shiftDate(endKey, -(n - 1 - i));
  return { key, st: cardioDay((days || {})[key]) };
});
// Totals over a window. `walkedDays` is the reading count every trend gate below is judged against.
const cardioAgg = (win) => {
  const st = win.map((x) => x.st).filter((s) => s && s.walked);
  const sum = (f) => st.reduce((a, s) => a + (f(s) || 0), 0);
  const hrD = st.filter((s) => s.avgHr != null), bandD = st.filter((s) => s.speedAtZone != null), restD = st.filter((s) => s.restingBPM != null);
  const measuredSec = sum((s) => s.measuredSec), inZoneSec = sum((s) => s.inZoneSec);
  // Task 63 — calories aggregate over the days that HAVE an estimate, and count the ones that don't
  // rather than absorbing them as zeroes. `kcal` keeps the name it has always had and the same value
  // (a day without an estimate contributed 0 to the old sum too); what is new is that `kcalDays` and
  // `kcalGapDays` travel with it, so no consumer can divide by the wrong denominator by accident.
  //
  // THE BANDS ARE SUMMED LINEARLY, NOT IN QUADRATURE, and that is a deliberate call: the dominant term
  // in PadCoach's error bar is a SYSTEMATIC model error — the same ACSM equation and the same
  // upper-body-support correction applied to every walk — so it does not average out across days the
  // way independent noise would. Adding the bounds treats the errors as perfectly correlated, which is
  // the conservative reading and the honest one here. Quadrature would narrow a 28-day band by roughly
  // a factor of five and imply an independence this data does not have.
  const calD = st.filter((s) => s.cal);
  return {
    days: win.length, walkedDays: st.length,
    zone2Min: sum((s) => s.zone2Min), movingSec: sum((s) => s.movingSec), distanceKm: sum((s) => s.distanceKm),
    steps: sum((s) => s.steps), kcal: sum((s) => s.kcal), measuredSec, inZoneSec,
    kcalLow: calD.reduce((a, s) => a + s.cal.lowKcal, 0), kcalHigh: calD.reduce((a, s) => a + s.cal.highKcal, 0),
    kcalDays: calD.length, kcalGapDays: st.length - calD.length,
    kcalSec: calD.reduce((a, s) => a + s.calSec, 0), kcalKm: calD.reduce((a, s) => a + s.calKm, 0),
    kcalPartialDays: calD.filter((s) => s.calOmitted || s.calMissingSessions > 0).length,
    sessions: sum((s) => s.sessions.length),
    inZonePct: measuredSec > 0 && inZoneSec > 0 ? (inZoneSec / measuredSec) * 100 : null,
    avgHr: hrD.length ? hrD.reduce((a, s) => a + s.avgHr, 0) / hrD.length : null, hrDays: hrD.length,
    speedAtZone: bandD.length ? bandD.reduce((a, s) => a + s.speedAtZone, 0) / bandD.length : null,
    bandSessions: sum((s) => s.bandSessions),
    restingBPM: restD.length ? restD.reduce((a, s) => a + s.restingBPM, 0) / restD.length : null, restDays: restD.length,
  };
};

// Apple's Trends, scaled to the history he actually has: the last n days against the n before them.
// Apple refuses to draw an arrow until it has 180 days; the same discipline applies here at TREND_FLOOR
// readings per window, and a row that can't clear it reports how far short it is instead of a direction.
const cardioTrendRows = (days, endKey, n = 28) => {
  const cur = cardioAgg(cardioWindow(days, endKey, n));
  const prev = cardioAgg(cardioWindow(days, shiftDate(endKey, -n), n));
  const row = (id, label, from, to, unit, better, prevN, curN, dp) => {
    const ready = prevN >= TREND_FLOOR && curN >= TREND_FLOOR && from != null && to != null && from !== 0;
    const pct = ready ? (to - from) / Math.abs(from) : null;
    const shown = ready ? Math.round(pct * 100) / 100 : null;
    const dir = !ready ? null : Math.abs(shown) < TREND_DEADBAND ? "flat" : pct > 0 ? "up" : "down";
    return { id, label, from, to, unit, better, dir, pct, ready, prevN, curN, floor: TREND_FLOOR, dp: dp == null ? 0 : dp };
  };
  const rows = [
    row("zone2", "Zone-2 min/day", prev.zone2Min / n, cur.zone2Min / n, " min", "up", prev.walkedDays, cur.walkedDays),
    row("moving", "Moving min/day", prev.movingSec / 60 / n, cur.movingSec / 60 / n, " min", "up", prev.walkedDays, cur.walkedDays),
    row("daysWk", "Days walked/week", (prev.walkedDays / n) * 7, (cur.walkedDays / n) * 7, "", "up", prev.walkedDays, cur.walkedDays, 1),
    row("inZone", "Time in zone", prev.inZonePct, cur.inZonePct, "%", "up", prev.walkedDays, cur.walkedDays),
    // Avg HR is deliberately NEUTRAL here: PadCoach pins heart rate and lets the belt float, so this number
    // is the controller's setpoint, not a fitness result. Speed is where fitness shows up.
    row("avgHr", "Avg HR", prev.avgHr, cur.avgHr, " bpm", null, prev.hrDays, cur.hrDays),
    row("speed", "Speed at " + Z2_MID + " bpm", prev.speedAtZone, cur.speedAtZone, " km/h", "up", prev.bandSessions, cur.bandSessions, 2),
  ];
  // Resting HR only appears once PadCoach is actually sending it — a permanently blank row would be noise.
  if (prev.restDays || cur.restDays) rows.push(row("resting", "Resting HR", prev.restingBPM, cur.restingBPM, " bpm", "down", prev.restDays, cur.restDays));
  // Task 63 — calories, on the days that carried an estimate. BOTH ROWS ARE NEUTRAL (`better: null`),
  // for the same class of reason avg HR is: a rise can be more walking, or it can be one turn of the
  // incline knob. Colouring it green would encode an achievement the data cannot support, and the
  // "what drives this" block on the Calories card exists precisely to tell those two apart.
  // The denominator is days WITH an estimate, never all walked days — a blank day must not be able to
  // halve a per-day average by pretending it was a zero-calorie walk.
  if (prev.kcalDays || cur.kcalDays) {
    rows.push(row("kcal", "Active kcal/day", prev.kcalDays ? prev.kcal / prev.kcalDays : null,
      cur.kcalDays ? cur.kcal / cur.kcalDays : null, " kcal", null, prev.kcalDays, cur.kcalDays));
    rows.push(row("kcalHr", "Active kcal/hour", prev.kcalSec > 0 ? prev.kcal / (prev.kcalSec / 3600) : null,
      cur.kcalSec > 0 ? cur.kcal / (cur.kcalSec / 3600) : null, " kcal/h", null, prev.kcalDays, cur.kcalDays));
  }
  return { rows, cur, prev, n };
};

// Monday-anchored weeks, oldest → newest, ending with the week that contains endKey (Strava and Zwift
// both anchor weekly views to Monday; his walks run late, so a Sunday-anchored week would split them).
const niceCeil = (v) => { if (!(v > 0)) return 0; const p = Math.pow(10, Math.floor(Math.log10(v / 4))); const c = [1, 2, 2.5, 3, 4, 5, 10].map((f) => f * p); return (c.find((x) => x * 4 >= v) || c[c.length - 1]) * 4; };
const weekStartKey = (key) => { const [y, m, d] = key.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); return dt.toLocaleDateString("en-CA"); };
const cardioWeeks = (days, endKey, n) => {
  const thisWeek = weekStartKey(endKey);
  return [...Array(n)].map((_, i) => {
    const start = shiftDate(thisWeek, -(n - 1 - i) * 7);
    const win = [...Array(7)].map((__, j) => ({ key: shiftDate(start, j), st: cardioDay((days || {})[shiftDate(start, j)]) }))
      .filter((x) => x.key <= endKey);                       // never count days that haven't happened yet
    const a = cardioAgg(win);
    const [, mm, dd] = start.split("-");
    return { start, lbl: `${+mm}/${+dd}`, partial: start === thisWeek, ...a };
  });
};
// 8 × 7 of gold-opacity cells. `future` marks the rest of this week so today never looks like a miss.
const cardioCalendar = (days, endKey, weeks = 8) => cardioWeeks(days, endKey, weeks).map((w) => ({
  start: w.start,
  cells: [...Array(7)].map((_, j) => { const key = shiftDate(w.start, j); return { key, st: cardioDay((days || {})[key]), future: key > endKey }; }),
}));

// Consecutive days walked, counted back from today — and if today hasn't happened yet the count starts at
// yesterday rather than breaking. A streak is a nudge, not a punishment (Strava's own streak is weekly for
// exactly this reason), so nothing here ever renders a missed day as a failure.
const cardioStreak = (days, endKey) => {
  const walked = (k) => { const s = cardioDay((days || {})[k]); return !!(s && s.walked); };
  let k = walked(endKey) ? endKey : shiftDate(endKey, -1), n = 0;
  while (walked(k) && n < 4000) { n++; k = shiftDate(k, -1); }
  return n;
};
// The three records that reward the behaviour he actually wants — time in zone, not pace (a treadmill
// pace record under closed-loop control measures the controller, not him).
const cardioRecords = (days, endKey) => {
  const keys = Object.keys(days || {}).sort();
  let session = null, day = null;
  keys.forEach((k) => {
    const st = cardioDay(days[k]); if (!st) return;
    st.sessions.forEach((s) => { const min = (s.inZoneSec || 0) / 60; if (min > 0 && (!session || min > session.min)) session = { min, key: k, movingMin: s.movingSec / 60 }; });
    const dmin = st.zone2Min; if (dmin != null && dmin > 0 && (!day || dmin > day.min)) day = { min: dmin, key: k };
  });
  const wk = cardioWeeks(days, endKey, 53).filter((w) => w.zone2Min > 0).sort((a, b) => b.zone2Min - a.zone2Min)[0] || null;
  return { session, day, week: wk ? { min: wk.zone2Min, start: wk.start } : null,
    longestSessionMin: keys.reduce((a, k) => { const st = cardioDay(days[k]); return st ? st.sessions.reduce((b, s) => Math.max(b, s.movingSec / 60), a) : a; }, 0) };
};
/* ───────────────── calorie statistics (Task 63) ─────────────────
   > "I checked coach ap and there is NO CALORIES ANYWHERE, we need stats for calories too"

   There has been one calorie figure on this tab since Task 57 — a dim line in the Today card and a chip
   on the trend chart. He sees none because his own payload carries none: a PadCoach bug recomputed
   every replayed session without his body settings, and the export builder never passed the
   upper-body-support setting. Both are fixed upstream, so the work here is to make calories a
   first-class statistic instead of one number, and to be exact about the days that will stay blank.

   Four rules, stated once:

   • NEVER A ZERO FOR A MISSING ESTIMATE. Three different things produce "no calories" and only one of
     them is a zero: a day he did not walk (genuinely zero active energy), a manual entry (no heart
     rate was measured, so no model applies at all), and a synced day PadCoach could not estimate or
     has not re-exported since the fix. The last two are gaps and are counted, named and rendered as
     gaps — and never allowed into a denominator.
   • NOTHING IS ESTIMATED HERE. This app has never had a calorie model and does not gain one now.
     Everything below is arithmetic over what PadCoach sent. A session missing grade or body weight
     gets nothing from PadCoach on purpose, and gets nothing here for the same reason.
   • ACTIVE, ALWAYS SAID OUT LOUD. See `cardioCalorie` above.
   • EVERY TOTAL CARRIES ITS BAND, and the band is summed linearly — see the note in `cardioAgg`. */

// Totals, rates and coverage over a window. `n` in days; null means the whole history.
const cardioCalorieStats = (days, endKey, n) => {
  const from = n ? shiftDate(endKey, -(n - 1)) : null;
  const keys = Object.keys(days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= endKey && (!from || k >= from)).sort();
  let kcal = 0, lo = 0, hi = 0, sec = 0, km = 0, gross = 0, grossDays = 0, resting = 0, restDays = 0;
  let unbanded = 0, belowFloor = 0, best = null;
  const est = [], gap = [], partial = [], models = new Map();
  keys.forEach((k) => {
    const st = cardioDay(days[k]);
    if (!st || !st.walked) return;                       // a day with no activity is not a gap, it is a rest day
    if (!st.cal) {
      // WHY there is no estimate, kept apart. "manual only" is structural and permanent for that day;
      // a measured day with no estimate is the one that fills in when PadCoach re-exports.
      gap.push({ key: k, movingSec: st.movingSec,
        manualOnly: st.sessions.length === 0 && st.manual.length > 0,
        reason: st.sessions.map((s) => s.calUnavailableReason).find(Boolean) || null });
      return;
    }
    est.push(k);
    kcal += st.cal.kcal; lo += st.cal.lowKcal; hi += st.cal.highKcal;
    sec += st.calSec; km += st.calKm;
    if (!st.cal.banded) unbanded++;
    if (st.cal.belowValidatedSpeedFloor) belowFloor++;
    if (st.cal.grossKcal != null) { gross += st.cal.grossKcal; grossDays++; }
    if (st.cal.restingKcal != null) { resting += st.cal.restingKcal; restDays++; }
    if (st.cal.model) models.set(st.cal.model, (models.get(st.cal.model) || 0) + 1);
    if (st.calOmitted || st.calMissingSessions > 0) partial.push(k);
    if (!best || st.cal.kcal > best.kcal) best = { key: k, kcal: st.cal.kcal, lowKcal: st.cal.lowKcal, highKcal: st.cal.highKcal };
  });
  const hours = sec / 3600;
  const per = (d) => (d > 0 ? { v: kcal / d, lo: lo / d, hi: hi / d } : { v: null, lo: null, hi: null });
  const walkedDays = est.length + gap.length;
  // Where the blanks sit decides the sentence the card shows. His case is `olderMissing`: everything
  // before PadCoach's fix has no estimate, everything after it does — which is a fact about the export,
  // not about him, and reads as a bug unless it is said.
  const shape = !walkedDays ? "empty" : !est.length ? "none" : !gap.length ? "complete"
    : gap[gap.length - 1].key < est[0] ? "olderMissing"
    : gap[0].key > est[est.length - 1] ? "newerMissing" : "scattered";
  return {
    n: n || null, firstKey: keys.length ? keys[0] : null, lastKey: keys.length ? keys[keys.length - 1] : null,
    walkedDays, estDays: est.length, gapDays: gap.length, gap, estKeys: est, shape,
    gapManualOnly: gap.filter((g) => g.manualOnly).length,
    gapMeasured: gap.filter((g) => !g.manualOnly).length,
    firstEstKey: est.length ? est[0] : null, lastEstKey: est.length ? est[est.length - 1] : null,
    kcal: est.length ? kcal : null, lowKcal: est.length ? lo : null, highKcal: est.length ? hi : null,
    bandPct: kcal > 0 && hi > lo ? ((hi - lo) / 2 / kcal) * 100 : null,
    sec, km, hours, partialDays: partial.length, unbandedDays: unbanded, belowFloorDays: belowFloor,
    perDay: per(est.length), perHour: per(hours), perKm: per(km),
    models: [...models.entries()].map(([id, count]) => ({ id, count })).sort((a, b) => b.count - a.count),
    best,
    // NOT SENT YET — both stay null on every real payload today, and the card says so rather than
    // deriving a gross figure from a resting rate this app does not have.
    grossKcal: grossDays ? gross : null, grossDays, restingKcal: restDays ? resting : null, restingDays: restDays,
  };
};

// One point per calendar day, oldest → newest. `cumulative` turns it into the running total that makes
// a long run of walking visible — and a day with no estimate FLATTENS that line rather than guessing at
// it, which is why the caption says so. In the daily view a walked day with no estimate is `null` (a
// visible gap) while a day he did not walk is a true 0.
const cardioCalorieSeries = (days, endKey, n, cumulative) => {
  let c = 0, cl = 0, ch = 0;
  return cardioWindow(days, endKey, n).map(({ key, st }) => {
    const walked = !!(st && st.walked);
    const cal = st && st.cal ? st.cal : null;
    if (cal) { c += cal.kcal; cl += cal.lowKcal; ch += cal.highKcal; }
    const [, mm, dd] = key.split("-");
    const gap = walked && !cal;
    const r = Math.round;
    return { key, d: `${+mm}/${+dd}`, gap,
      v: cumulative ? r(c) : gap ? null : cal ? r(cal.kcal) : 0,
      lo: cumulative ? r(cl) : gap ? null : cal ? r(cal.lowKcal) : 0,
      hi: cumulative ? r(ch) : gap ? null : cal ? r(cal.highKcal) : 0 };
  });
};

// What actually drives the number, from the fields the export carries: the treadmill grade, which model
// ran (ACSM unloaded vs Pandolf with a vest), and the upper-body-support reduction. Sessions are grouped
// by that triple, so a jump in the daily figure caused by one turn of the incline knob reads as a change
// of setting rather than as a change in him. Body weight is NOT on the wire, so it cannot appear here —
// the card says that instead of implying weight is constant.
const CAL_MODEL_LABEL = { acsm: "ACSM walking equation", pandolf: "Pandolf load carriage" };
const cardioCalorieDrivers = (days, endKey, n) => {
  const from = n ? shiftDate(endKey, -(n - 1)) : null;
  const rows = [];
  Object.keys(days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= endKey && (!from || k >= from)).sort().forEach((k) => {
    const st = cardioDay(days[k]); if (!st) return;
    st.sessions.forEach((s) => {
      if (!s.cal || !(s.movingSec > 0)) return;
      rows.push({ key: k, min: s.movingSec / 60, kcal: s.cal.kcal, kcalPerHour: s.cal.kcal / (s.movingSec / 3600),
        kcalPerKm: s.distanceKm > 0 ? s.cal.kcal / s.distanceKm : null,
        grade: s.gradePercent, gradeSource: s.gradeSource, model: s.cal.model,
        support: s.cal.supportReductionFraction, speed: s.avgSpeedKmh, hr: s.avgHr });
    });
  });
  if (!rows.length) return null;
  const gid = (r) => `${r.grade == null ? "?" : r.grade.toFixed(2)}|${r.model || "?"}|${r.support == null ? "?" : r.support.toFixed(3)}`;
  const map = new Map();
  rows.forEach((r) => {
    const id = gid(r);
    if (!map.has(id)) map.set(id, { id, grade: r.grade, gradeSource: r.gradeSource, model: r.model, support: r.support, rows: [] });
    map.get(id).rows.push(r);
  });
  const groups = [...map.values()].map((g) => {
    const minutes = g.rows.reduce((a, r) => a + r.min, 0);
    // Time-weighted, never a plain mean of session rates: a 96-minute walk and a 21-minute one are not
    // two equal votes on what an hour of walking costs.
    const wm = (f) => { const ok = g.rows.filter((r) => f(r) != null); const t = ok.reduce((a, r) => a + r.min, 0);
      return t > 0 ? ok.reduce((a, r) => a + f(r) * r.min, 0) / t : null; };
    return { ...g, n: g.rows.length, minutes, from: g.rows[0].key, to: g.rows[g.rows.length - 1].key,
      kcal: g.rows.reduce((a, r) => a + r.kcal, 0),
      kcalPerHour: minutes > 0 ? g.rows.reduce((a, r) => a + r.kcal, 0) / (minutes / 60) : null,
      kcalPerKm: wm((r) => r.kcalPerKm), speed: wm((r) => r.speed), hr: wm((r) => r.hr) };
  }).sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0));
  // The one change worth naming: the newest session's group, against the group of the newest session
  // before it that belonged to a different one. Three rules keep this from over-claiming:
  //
  //  • A DIMENSION UNKNOWN ON EITHER SIDE IS NOT A CHANGE. A session with no recorded grade beside one
  //    with 8.75% does not mean the incline moved — it means one of the two was never written down.
  //    Saying "what changed was the grade" there would be an inference the data cannot support.
  //  • IF NOTHING NAMEABLE DIFFERS, THERE IS NO SENTENCE. `change` stays null and the group table alone
  //    is shown, rather than a sentence that cannot finish itself.
  //  • A MOVE UNDER THE APP'S OWN 3% DEADBAND IS NOT A JUMP, and this card exists to explain jumps.
  //
  // `sinceKey` is the date the new setting first applied — the first session after the old one — not
  // the group's first-ever appearance, which can be months earlier if a setting was used, dropped and
  // picked up again.
  const last = rows[rows.length - 1], lastId = gid(last);
  let prevRow = null, prevIdx = -1;
  for (let i = rows.length - 2; i >= 0; i--) { if (gid(rows[i]) !== lastId) { prevRow = rows[i]; prevIdx = i; break; } }
  const gOf = (id) => groups.find((g) => g.id === id) || null;
  let change = null;
  if (prevRow) {
    const a = gOf(gid(prevRow)), b = gOf(lastId);
    if (a && b && a.kcalPerHour != null && b.kcalPerHour != null && a.kcalPerHour > 0) {
      const what = [];
      const known = (x, y) => x != null && y != null;
      if (known(a.grade, b.grade) && a.grade.toFixed(2) !== b.grade.toFixed(2)) what.push("grade");
      if (known(a.model, b.model) && a.model !== b.model) what.push("model");
      if (known(a.support, b.support) && a.support.toFixed(3) !== b.support.toFixed(3)) what.push("support setting");
      const pct = ((b.kcalPerHour - a.kcalPerHour) / a.kcalPerHour) * 100;
      if (what.length && Math.abs(pct) >= TREND_DEADBAND * 100)
        change = { from: a, to: b, sinceKey: rows[prevIdx + 1].key, what, pct };
    }
  }
  return { rows, groups, change, sessions: rows.length,
    gradeKnown: rows.some((r) => r.grade != null),
    modelKnown: rows.some((r) => r.model != null),
    supportKnown: rows.some((r) => r.support != null) };
};

/* ───────────────── deep cardio analytics (Task 60) ─────────────────
   The Cardio tab's foundation (Task 57/59) answers "what did I do". This layer answers
   "is it working, and where is it going" — and it is deliberately NOT a copy of what Garmin,
   Whoop or Strava compute. `docs/superpowers/specs/2026-09-10-platform-metrics-survey.md`
   read the primary sources and found that most of the famous load family is structurally
   wrong for a treadmill-desk walker:

   • Every Garmin load metric is EPOC-derived, and Firstbeat's own white papers say EPOC
     "plateaus if intensity falls below the anaerobic threshold (75% VO2max)". A 90-minute
     zone-2 walk therefore scores barely more than a 40-minute one. Blind to duration at
     exactly the intensity he trains at.
   • Banister's TRIMP applies an exponential HR weighting written explicitly "to avoid giving
     too much emphasis to low-intensity exercise of long duration" — i.e. it down-weights his
     entire training plan on purpose.
   • ACWR is not defensible as injury risk (see CARDIO_NOT_COMPUTED below), so there is no
     acute:chronic ratio anywhere in this file, and no number here is ever coloured as danger.

   What IS right for long steady work, and is what this file computes:
   • Efficiency Factor — SPEED ÷ HR (never pace, which inverts the direction of improvement).
   • Aerobic decoupling with Friel's <5% / 5–10% / >10% bands.
   • A LINEAR-IN-DURATION load model, so two hours counts as two hours.
   • CTL / ATL / TSB on the standard 42-day / 7-day EWMA constants.
   • Least-squares projections that report an INTERVAL, never a date.

   Every function below is pure, lives in the harness's pure zone, and is covered by
   tests/run-tests.mjs. The sparse case is the designed case: he has ~4 sessions, so nothing
   here returns a confident-looking number off two points — it returns null plus the reason. */

// TrainingPeaks: decoupling "values under 20 minutes are not valid". The same floor is applied to
// Efficiency Factor, for the same reason — a five-minute walk is warm-up, not steady state.
const STEADY_MIN_SEC = 1200;
const CTL_TAU = 42, ATL_TAU = 7;          // TrainingPeaks' own constants, unchanged
const GOAL_MIN_FALLBACK = 240;            // 4 h/day in zone — his stated goal, used only until PadCoach sends one
// Friel: "if an athlete's decoupling is consistently 5% or less for steady-state aerobic workouts
// then his or her aerobic endurance is sound." 5–10% = a moderate aerobic limitation, >10% = the
// effort was above the aerobic threshold.
const DECOUPLE_BANDS = [
  { id: "sound", hi: 5, label: "under 5%", meaning: "aerobic endurance is sound (Friel)" },
  { id: "moderate", hi: 10, label: "5–10%", meaning: "a moderate aerobic limitation (Friel)" },
  { id: "high", hi: Infinity, label: "over 10%", meaning: "the effort was above your aerobic threshold (Friel)" },
];
// Rendered verbatim in the Method card. Anything this app refuses to compute has to say why on
// screen — an omission the user cannot see is indistinguishable from an oversight.
const CARDIO_NOT_COMPUTED = [
  { id: "acwr", what: "Acute:chronic workload ratio / “injury risk” gauge",
    why: "The acute window sits inside the chronic one, so the two are mathematically coupled. A 1000-season simulation built to contain no ACWR–injury relationship at all still reproduced the published “sweet spot”, and replacing chronic load with random numbers gives the same odds ratios. Garmin ships one anyway; industry adoption is not validation." },
  { id: "vo2", what: "VO₂max / cardio fitness score",
    why: "Apple: “Indoor workouts, including ones that require gym equipment, do not count towards your cardio fitness estimate.” Garmin needs outdoor GPS or a power meter, and excludes indoor runs “in order to preserve the accuracy of your fitness level trend”. Both vendors decline to compute it from exactly your conditions. Speed at a fixed heart rate, above, is the measured local substitute." },
  { id: "garminload", what: "Garmin-style training load / training effect / training status",
    why: "All of it is EPOC-derived, and Firstbeat's own papers say EPOC stops accumulating below ~75% of VO₂max. It would score your 96-minute walk about the same as a 40-minute one — blind to duration at the one intensity you train at." },
  { id: "banister", what: "Banister's exponential TRIMP",
    why: "Its heart-rate weighting exists, in Banister's words, “to avoid giving too much emphasis to low-intensity exercise of long duration”. That is a description of your training plan. The zone-weighted load above is linear in duration instead." },
  { id: "strain", what: "Whoop Strain, Body Battery, Recovery, Readiness, Fitness Age",
    why: "Published as a shape, never as a formula. Reimplementing the shape without the calibration produces a number that looks like Whoop's and isn't." },
  { id: "pace", what: "Pace personal records, best efforts, segments, grade-adjusted pace",
    why: "The belt speed is set by a controller holding your heart rate. A fastest-5k record would be a record set by PadCoach, not by you. The records card tracks time in zone instead, which is the unit of your actual goal." },
  // Task 63 — three calorie refusals, because the tempting thing to do with a calorie number is exactly
  // the thing that would make it wrong.
  { id: "grosskcal", what: "Gross calories, or a total daily energy expenditure",
    why: "Every calorie figure here is ACTIVE — what the walk cost on top of simply being alive. Reconstructing the gross number needs the resting term the ACSM and Pandolf equations carry, which needs your body weight, and body weight is not on the wire at all. It would also be the wrong number to publish: added to a day that already accounts for basal expenditure, gross double-counts about a fifth of it silently. PadCoach subtracted that term on purpose before sending this. If it ever sends the gross and resting figures too, they appear here as their own labelled numbers — never in place of the active one." },
  { id: "manualkcal", what: "Calories for a manual entry, or for any session PadCoach declined to estimate",
    why: "A manual walk has no heart rate, no belt speed and no grade — there is nothing to run a model against, and inventing one would put a fabricated number beside measured ones with no way to tell them apart. PadCoach returns nothing for a session missing grade or body weight for the same reason. Those days are counted as blanks on the Calories card and named, never filled in." },
  { id: "kcalproj", what: "A projection of future calories",
    why: "The projections card fits volume, speed, efficiency and resting heart rate — things that move with fitness. Calories move with how long you walk and how steep the belt is, both of which you set directly, so a fitted line through them would forecast your own decisions and dress them up as a trend." },
];

// Day key ↔ integer day, used only as a regression x-axis. Both ends go through the same function,
// so only the difference matters and it is DST-proof.
const dayNum = (key) => { const [y, m, d] = key.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };

// ── Efficiency Factor ──────────────────────────────────────────────────────────────────────
// TrainingPeaks defines it for walking explicitly: Run/Walk EF (metric) = speed in m/min ÷ avg HR.
// SPEED, never pace: pace (min/km) falls as fitness rises, so a pace-based ratio would render an
// improvement as a decline. Not grade-adjusted here — his incline is a fixed manual setting, so it
// is a constant scale factor while it is unchanged, and the caption on the card says so.
const sessionEF = (s) => {
  if (!s || s.avgHr == null || !(s.avgHr > 0) || !(s.movingSec >= STEADY_MIN_SEC) || !(s.distanceKm > 0)) return null;
  return (s.distanceKm * 1000) / (s.movingSec / 60) / s.avgHr;
};

// ── Aerobic decoupling ─────────────────────────────────────────────────────────────────────
// Friel: decoupling % = (EF_first_half − EF_second_half) / EF_first_half × 100. A POSITIVE number
// is drift (output fell relative to heart rate).
//
// Two sources, in order of preference:
//   1. The two halves PadCoach sends (speed + HR for each). Friel's formula computed from
//      primitives — no sign convention to guess at.
//   2. PadCoach's own `decoupling.percent`, which is signed as the CHANGE in efficiency
//      (its fixture pairs percent −5.7 with speedDriftPercent −6.1, i.e. negative = it fell),
//      so Friel's drift is its negation. That inference is flagged as `assumedSign` and shown.
// Sessions under 20 minutes get no reading at all — TrainingPeaks' own validity rule.
const sessionDecoupling = (s) => {
  const d = s && s.decoupling;
  if (!d) return null;
  if (!(s.movingSec >= STEADY_MIN_SEC)) return { pct: null, band: null, tooShort: true, confidence: d.confidence || null, assumedSign: false };
  let pct = null, assumedSign = false;
  if (d.firstHalfSpeedKmh && d.secondHalfSpeedKmh && d.firstHalfAvgHeartRate && d.secondHalfAvgHeartRate) {
    const ef1 = d.firstHalfSpeedKmh / d.firstHalfAvgHeartRate, ef2 = d.secondHalfSpeedKmh / d.secondHalfAvgHeartRate;
    if (ef1 > 0) pct = ((ef1 - ef2) / ef1) * 100;
  }
  if (pct == null && d.percent != null) { pct = -d.percent; assumedSign = true; }
  if (pct == null) return null;
  // Negative decoupling — efficiency ROSE across the walk — is not a limitation, so it lands in
  // Friel's soundest band rather than being read as a large magnitude.
  const band = pct <= 0 ? DECOUPLE_BANDS[0] : (DECOUPLE_BANDS.find((b) => pct < b.hi) || DECOUPLE_BANDS[DECOUPLE_BANDS.length - 1]);
  return { pct, band, tooShort: false, confidence: d.confidence || null, assumedSign };
};

// ── A duration-fair load model ─────────────────────────────────────────────────────────────
// Zone-time × zone-weight, in Edwards' SHAPE but not his numbers, and the difference is stated on
// screen rather than buried here. Edwards' five weights are fractions of MAXIMUM heart rate, and
// he has never done a maximal test — nothing in this app or in PadCoach's export carries an HRmax,
// and guessing one (220 − age) would put the whole scale on a population curve that a 15 bpm miss
// moves by ~9%. So the weights are applied to the ONE zone structure his data really contains: the
// band PadCoach recorded as active for that session.
//   in band      × 2      the work he is actually there to do
//   outside it   × 1      warm-up, drift below the band, walking to the machine
//   above band   × 3      only when the session's own average cleared the band's top
// Linear in duration by construction: two hours scores twice one hour. That is the whole point —
// see the survey note on EPOC at the top of this block.
// Manual entries are excluded: a manual walk has no heart rate, so it has no zone time, and padding
// it with a guess would be the one thing this tab has never done.
const ZONE_W_IN = 2, ZONE_W_OUT = 1, ZONE_W_ABOVE = 3;
const sessionLoad = (s) => {
  if (!s || !(s.movingSec > 0) || s.avgHr == null) return null;
  const inMin = Math.min(s.inZoneSec || 0, s.movingSec) / 60;
  const otherMin = Math.max(0, s.movingSec - (s.inZoneSec || 0)) / 60;
  const above = s.avgHr > (s.bandHigh || Z2_HI);
  return inMin * ZONE_W_IN + otherMin * (above ? ZONE_W_ABOVE : ZONE_W_OUT);
};
// null (not 0) for a day with no heart-rate-bearing session — "didn't walk" and "walked with the
// strap off" are different facts, and only the first is honestly a zero.
const dayLoad = (st) => {
  if (!st) return null;
  const ls = st.sessions.map(sessionLoad).filter((v) => v != null);
  return ls.length ? ls.reduce((a, b) => a + b, 0) : null;
};

// ── CTL / ATL / TSB ────────────────────────────────────────────────────────────────────────
// The standard exponentially-weighted moving averages: 42-day chronic (Fitness), 7-day acute
// (Fatigue), TSB = yesterday's CTL − yesterday's ATL (Form), which is how TrainingPeaks defines it.
// alpha = 1 − e^(−1/τ) is the continuous-time form, not the 1/τ approximation.
//
// TrainingPeaks' own caveat travels with these numbers and is rendered on the card verbatim:
// TSB is "not a predictor of performance but a measure of how adapted an athlete is to their
// training load." He is not tapering for anything, so a negative TSB is not a warning here.
//
// Runs forward from the first day he has data, never from the start of the chart window, so the
// EWMAs are correct even when only the last 60 days are drawn. `filling` is true until 42 days of
// history exist, because until then CTL is still climbing out of its zero seed and UNDERSTATES.
const cardioLoadHistory = (days, endKey) => {
  const keys = Object.keys(days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= endKey).sort();
  const empty = { rows: [], first: null, spanDays: 0, filling: true, loadDays: 0, ctl: null, atl: null, tsb: null, ramp: null };
  if (!keys.length) return empty;
  const first = keys[0];
  const span = dayNum(endKey) - dayNum(first) + 1;
  if (!(span > 0)) return empty;
  const aC = 1 - Math.exp(-1 / CTL_TAU), aA = 1 - Math.exp(-1 / ATL_TAU);
  let ctl = 0, atl = 0, loadDays = 0, key = first;
  const rows = [];
  for (let i = 0; i < span && i < 4000; i++) {
    const l = dayLoad(cardioDay((days || {})[key]));
    const load = l == null ? 0 : l;
    if (l != null && l > 0) loadDays++;
    const pC = ctl, pA = atl;
    ctl = pC + (load - pC) * aC;
    atl = pA + (load - pA) * aA;
    rows.push({ key, load, ctl, atl, tsb: pC - pA, measured: l != null });
    key = shiftDate(key, 1);
  }
  const last = rows[rows.length - 1];
  const back = rows.length > 7 ? rows[rows.length - 8] : null;
  return { rows, first, spanDays: span, filling: span < CTL_TAU, loadDays,
    ctl: last.ctl, atl: last.atl, tsb: last.tsb, ramp: back ? last.ctl - back.ctl : null };
};

// Foster's monotony: the week's mean daily load ÷ its standard deviation, rest days counted as the
// zeroes they are. Reported here as EVENNESS and nothing else. Foster pairs it with a "strain"
// score (load × monotony) used as an injury-risk signal; this app does not compute that, for the
// same reason it does not compute ACWR.
const loadMonotony = (loads) => {
  const v = (loads || []).filter((x) => typeof x === "number" && isFinite(x));
  if (v.length < 7) return null;
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
  if (!(sd > 0) || !(mean > 0)) return null;
  return { mean, sd, monotony: mean / sd, days: v.length };
};

// ── Least squares, with an interval that widens honestly ───────────────────────────────────
// Two-sided 95% critical values of Student's t, by degrees of freedom. Small-n is the whole point:
// at n = 3 (df 1) t is 12.7, so a projection from three points comes back with a range so wide it
// visibly refuses to be a prediction. That is the correct output, not a failure of the method.
const T95 = [12.706, 4.303, 3.182, 2.776, 2.571, 2.447, 2.365, 2.306, 2.262, 2.228, 2.201, 2.179,
  2.160, 2.145, 2.131, 2.120, 2.110, 2.101, 2.093, 2.086, 2.080, 2.074, 2.069, 2.064, 2.060, 2.056,
  2.052, 2.048, 2.045, 2.042];
const tCrit = (df) => (df <= 0 ? null : df <= 30 ? T95[df - 1] : df <= 40 ? 2.021 : df <= 60 ? 2.0 : df <= 120 ? 1.98 : 1.96);

// Ordinary least squares over [{x, y}]. Returns null under three points — two points define a line
// with no residual and therefore no uncertainty, which would be the most dishonest chart on the tab.
// `ci(x)` is the confidence band on the MEAN response (what a projection crosses); `pi(x)` is the
// wider prediction band for a single future day. Both widen with distance from the data's centre.
const linFit = (pts) => {
  const p = (pts || []).filter((q) => q && isFinite(q.x) && isFinite(q.y));
  const n = p.length;
  if (n < 3) return null;
  const mx = p.reduce((a, q) => a + q.x, 0) / n, my = p.reduce((a, q) => a + q.y, 0) / n;
  const sxx = p.reduce((a, q) => a + (q.x - mx) ** 2, 0);
  if (!(sxx > 0)) return null;                                  // every reading on one day is not a trajectory
  const sxy = p.reduce((a, q) => a + (q.x - mx) * (q.y - my), 0);
  const slope = sxy / sxx, intercept = my - slope * mx;
  const resid = p.reduce((a, q) => a + (q.y - (intercept + slope * q.x)) ** 2, 0);
  const syy = p.reduce((a, q) => a + (q.y - my) ** 2, 0);
  const df = n - 2, se2 = resid / df, sigma = Math.sqrt(se2), t = tCrit(df);
  const seSlope = Math.sqrt(se2 / sxx);
  const at = (x) => intercept + slope * x;
  const ci = (x) => t * sigma * Math.sqrt(1 / n + (x - mx) ** 2 / sxx);
  const pi = (x) => t * sigma * Math.sqrt(1 + 1 / n + (x - mx) ** 2 / sxx);
  return { n, df, mx, sxx, slope, intercept, sigma, seSlope, t, at, ci, pi,
    slopeLo: slope - t * seSlope, slopeHi: slope + t * seSlope,
    // A slope whose interval straddles zero is not distinguishable from flat, whatever its sign.
    signif: sigma > 0 && (slope - t * seSlope) * (slope + t * seSlope) > 0,
    degenerate: !(sigma > 0),
    r2: syy > 0 ? Math.max(0, 1 - resid / syy) : null };
};

// When does the fitted line reach `target`, and what is the earliest / latest date the data is
// consistent with? Scans forward day by day and reports where the fit, its upper confidence bound
// and its lower confidence bound each cross. `latest === null` means the data is also consistent
// with never getting there at this rate — which is said in those words rather than hidden.
const projectCross = (fit, target, x0, maxDays = 1826) => {
  if (!fit || !isFinite(target)) return null;
  const up = target > fit.at(x0);
  const reach = (v) => (up ? v >= target : v <= target);
  let central = null, earliest = null, latest = null;
  for (let d = 0; d <= maxDays; d++) {
    const x = x0 + d, f = fit.at(x), w = fit.ci(x);
    if (central == null && reach(f)) central = d;
    if (earliest == null && reach(up ? f + w : f - w)) earliest = d;
    if (latest == null && reach(up ? f - w : f + w)) latest = d;
    if (central != null && earliest != null && latest != null) break;
  }
  return { central, earliest, latest, horizonDays: maxDays, up,
    never: central == null, latestUnbounded: latest == null };
};

// One projection, display-ready. NOTHING here is a fact: `ok` is false until the series clears the
// app's existing reading floor (PadCoach's TrendDataFloor rule — five or fewer readings is not a
// trend, already the gate the 28-vs-28 rows use), and even when it is true the card prints the
// number of readings, the days they span, and the interval rather than the date.
const cardioProjection = (pts, opts) => {
  const o = opts || {};
  const target = o.target;
  const p = (pts || []).slice().sort((a, b) => a.x - b.x);
  const n = p.length;
  const spanDays = n >= 2 ? p[n - 1].x - p[0].x + 1 : n;
  const base = { id: o.id || null, label: o.label || null, unit: o.unit || "", dp: o.dp == null ? 2 : o.dp,
    betterUp: o.betterUp !== false, n, spanDays, floor: TREND_FLOOR, target: target == null ? null : target,
    latest: n ? p[n - 1].y : null, first: n ? p[0].y : null, points: p, fit: null, cross: null, ok: false, reason: null };
  if (n < TREND_FLOOR)
    return { ...base, reason: `needs ${TREND_FLOOR}+ readings to fit a line — ${n} so far` };
  const fit = linFit(p);
  if (!fit) return { ...base, reason: "every reading lands on the same day, so there is no trajectory to fit yet" };
  if (fit.degenerate)
    return { ...base, fit, reason: "the readings fall exactly on a line, so this data cannot estimate its own uncertainty — treat the slope as arithmetic, not as a projection" };
  const x0 = p[n - 1].x;
  const cross = target == null ? null : projectCross(fit, target, x0, o.maxDays || 1826);
  const per = o.per == null ? 30 : o.per;                       // slope is reported per 30 days by default
  return { ...base, fit, cross, ok: true, per,
    slopePer: fit.slope * per, slopeLoPer: fit.slopeLo * per, slopeHiPer: fit.slopeHi * per,
    r2: fit.r2, signif: fit.signif,
    reason: fit.signif ? null : "the 95% interval on this slope includes zero — the direction is not yet distinguishable from flat" };
};

// A fitted line plus its confidence band, sampled for a chart: measured points to `endKey`, then
// `ahead` days of projection. Deliberately three separate keys so the chart can draw the fit and
// its bounds as dashed lines and the measurements as dots — no new chart primitive needed.
const cardioFitSeries = (pr, endKey, ahead = 60, step = 3) => {
  if (!pr || !pr.ok || !pr.fit) return [];
  const fit = pr.fit, pts = pr.points, x0 = pts[0].x, xN = pts[pts.length - 1].x;
  const byX = new Map(pts.map((q) => [q.x, q.y]));
  const out = [];
  const yr = xN + ahead - x0 > 300;                  // long enough to cross a year boundary
  const add = (x) => { if (out.some((r) => r.x === x)) return; const w = fit.ci(x);
    out.push({ x, d: cardioFitLabel(x, yr), v: byX.has(x) ? Math.round(byX.get(x) * 1000) / 1000 : null,
      fit: Math.round(fit.at(x) * 1000) / 1000, lo: Math.round((fit.at(x) - w) * 1000) / 1000, hi: Math.round((fit.at(x) + w) * 1000) / 1000 }); };
  for (let x = x0; x <= xN + ahead; x += step) add(x);
  add(xN + ahead);                                  // the horizon itself, whatever the step lands on
  pts.forEach((q) => add(q.x));                     // every measured reading, even between samples
  return out.sort((a, b) => a.x - b.x);
};
// A projection that runs past a year has to say WHICH year: "11/8" after "8/29" reads as going
// backwards on an axis that is actually going forwards.
const cardioFitLabel = (x, withYear) => { const dt = new Date(x * 86400000);
  return `${dt.getUTCMonth() + 1}/${dt.getUTCDate()}` + (withYear ? `/${String(dt.getUTCFullYear()).slice(2)}` : ""); };

// ── Series builders ────────────────────────────────────────────────────────────────────────
// One point per SESSION (efficiency, decoupling, speed are session-level facts) or per DAY
// (resting HR, volume). `n` limits the window in days; null means the whole history.
const cardioSessionPoints = (days, endKey, n, pick) => {
  const from = n ? shiftDate(endKey, -(n - 1)) : null;
  const out = [];
  Object.keys(days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= endKey && (!from || k >= from)).sort()
    .forEach((k) => { const st = cardioDay(days[k]); if (!st) return;
      st.sessions.forEach((s) => { const y = pick(s, st); if (y != null && isFinite(y)) out.push({ key: k, x: dayNum(k), y }); }); });
  return out;
};
const cardioDayPoints = (days, endKey, n, pick) => {
  const from = n ? shiftDate(endKey, -(n - 1)) : null;
  const out = [];
  Object.keys(days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= endKey && (!from || k >= from)).sort()
    .forEach((k) => { const st = cardioDay(days[k]); if (!st) return;
      const y = pick(st, k); if (y != null && isFinite(y)) out.push({ key: k, x: dayNum(k), y }); });
  return out;
};

// Week over week, as DESCRIPTION. The survey is explicit that a load ratio is not defensible as an
// injury-risk signal, so this is never coloured as danger and never called a ratio — it is the
// change in a number he can already see, stated as a number.
const cardioWeekOverWeek = (weeks) => {
  const done = (weeks || []).filter((w) => !w.partial);
  if (done.length < 2) return null;
  const a = done[done.length - 2], b = done[done.length - 1];
  const pct = a.zone2Min > 0 ? ((b.zone2Min - a.zone2Min) / a.zone2Min) * 100 : null;
  return { prev: a, last: b, pct, deadband: TREND_DEADBAND * 100 };
};

// ── "Am I getting fitter?" ─────────────────────────────────────────────────────────────────
// One honest top line, assembled from the signals that actually bear on fitness, each of which
// reports its own state and — when it is not ready — exactly what is missing.
//
// Volume is deliberately NOT a fitness signal. Walking more is doing more, not being fitter, and
// conflating the two would let the one number he controls directly answer the question for him.
const cardioFitnessVerdict = (days, an, endKey) => {
  const sig = [];
  // `state` is the verdict (better/worse/flat); `moved` is which way the NUMBER actually went.
  // They differ wherever down is good — resting HR, decoupling — and rendering one arrow from the
  // verdict alone would print "↑ better" beside a falling resting heart rate.
  const push = (id, label, state, detail, need, moved) => sig.push({ id, label, state, detail: detail || null, need: need || null, moved: moved || null });

  // 1. PadCoach's own efficiency trend, when it sends one AND its own confidence says it may count.
  const eff = an && an.efficiency ? an.efficiency : null;
  if (eff && eff.direction && eff.direction !== "unknown" && confOk(eff.confidence))
    push("padEff", "PadCoach efficiency trend",
      eff.direction === "improving" ? "better" : eff.direction === "declining" ? "worse" : "flat",
      `${eff.direction} across ${eff.readings.length} matched-effort session${eff.readings.length === 1 ? "" : "s"}`,
      null, eff.direction === "improving" ? "up" : eff.direction === "declining" ? "down" : "flat");
  else if (eff)
    push("padEff", "PadCoach efficiency trend", "waiting", null,
      (eff.confidence && eff.confidence.reason) || `${eff.readings.length} reading${eff.readings.length === 1 ? "" : "s"} so far`);

  // 2. Speed at his own band — the coach-side answer, computed from fields the export has always sent.
  const spd = cardioProjection(cardioSessionPoints(days, endKey, null, (s) => (inBandSession(s) ? s.avgSpeedKmh : null)),
    { id: "speed", label: `Speed at ${Z2_MID} bpm`, unit: " km/h", dp: 2, betterUp: true });
  push("speed", `Speed at ${Z2_MID} bpm`,
    !spd.ok || !spd.signif ? "waiting" : spd.fit.slope > 0 ? "better" : "worse",
    spd.ok && spd.signif ? `${spd.slopePer > 0 ? "+" : ""}${spd.slopePer.toFixed(2)} km/h per 30 days` : null,
    spd.reason, spd.ok && spd.signif ? (spd.fit.slope > 0 ? "up" : "down") : null);

  // 3. Efficiency Factor, computed coach-side from speed ÷ HR — the metric neither Garmin nor Strava shows.
  const efp = cardioProjection(cardioSessionPoints(days, endKey, null, sessionEF),
    { id: "ef", label: "Efficiency Factor", unit: "", dp: 3, betterUp: true });
  push("ef", "Efficiency Factor",
    !efp.ok || !efp.signif ? "waiting" : efp.fit.slope > 0 ? "better" : "worse",
    efp.ok && efp.signif ? `${efp.slopePer > 0 ? "+" : ""}${efp.slopePer.toFixed(3)} per 30 days` : null, efp.reason,
    efp.ok && efp.signif ? (efp.fit.slope > 0 ? "up" : "down") : null);

  // 4. Resting heart rate — down is better. Only appears once something actually sends one.
  const rhrPts = cardioDayPoints(days, endKey, null, (st) => st.restingBPM);
  if (rhrPts.length) {
    const r = cardioProjection(rhrPts, { id: "rhr", label: "Resting HR", unit: " bpm", dp: 0, betterUp: false });
    push("rhr", "Resting HR", !r.ok || !r.signif ? "waiting" : r.fit.slope < 0 ? "better" : "worse",
      r.ok && r.signif ? `${r.slopePer > 0 ? "+" : ""}${r.slopePer.toFixed(1)} bpm per 30 days` : null, r.reason,
      r.ok && r.signif ? (r.fit.slope > 0 ? "up" : "down") : null);
  }

  // 5. Aerobic durability — does decoupling shrink over months? Only when PadCoach sends decoupling.
  const decPts = cardioSessionPoints(days, endKey, null, (s) => { const d = sessionDecoupling(s); return d && !d.tooShort ? d.pct : null; });
  if (decPts.length) {
    const dproj = cardioProjection(decPts, { id: "dec", label: "Aerobic decoupling", unit: "%", dp: 1, betterUp: false });
    push("dec", "Aerobic decoupling", !dproj.ok || !dproj.signif ? "waiting" : dproj.fit.slope < 0 ? "better" : "worse",
      dproj.ok && dproj.signif ? `${dproj.slopePer > 0 ? "+" : ""}${dproj.slopePer.toFixed(1)}% per 30 days` : null, dproj.reason,
      dproj.ok && dproj.signif ? (dproj.fit.slope > 0 ? "up" : "down") : null);
  }

  const better = sig.filter((s) => s.state === "better").length;
  const worse = sig.filter((s) => s.state === "worse").length;
  const flat = sig.filter((s) => s.state === "flat").length;
  const ready = better + worse + flat;
  const headline = !ready
    ? "Not yet — no fitness signal has enough behind it to answer."
    : worse === 0 && better > 0 ? "Yes — every signal with enough data behind it says so."
    : better > 0 && worse > 0 ? "Mixed — the signals disagree, which usually means it is still too early."
    : worse > 0 ? "Not on these signals — and one reading is not a verdict, so read this over months."
    : "Holding steady — measured, not guessed at, and not the same thing as no data.";
  return { headline, signals: sig, ready, better, worse, flat, speed: spd, ef: efp };
};
const DEFAULT_FOOD_IDS = ["chicken300", "rice200", "eggs3", "whites200", "whey1"];   // original staples — never pruned
// keep all favs + default staples; cap other foods to the n most-recently-used (by lastUsedT).
const pruneFoods = (foods, n = 40) => { const arr = foods || []; const keep = arr.filter((f) => f.fav || f.corr || DEFAULT_FOOD_IDS.includes(f.id)); const rest = arr.filter((f) => !f.fav && !f.corr && !DEFAULT_FOOD_IDS.includes(f.id)).sort((a, b) => (b.lastUsedT || "").localeCompare(a.lastUsedT || "")).slice(0, n); const ok = new Set([...keep, ...rest]); return arr.filter((f) => ok.has(f)); };
// derived, pure selectors over the food library
const favorites = (nut) => (nut.foods || []).filter((f) => f.fav);
const recents = (nut, n = 12) => (nut.foods || []).filter((f) => f.lastUsedT && !f.fav).sort((a, b) => (b.lastUsedT || "").localeCompare(a.lastUsedT || "")).slice(0, n);
const sleepHours = (bed, wake) => { if (!bed || !wake) return null; const [bh, bm] = bed.split(":").map(Number); const [wh, wm] = wake.split(":").map(Number); let m = (wh * 60 + wm) - (bh * 60 + bm); if (m <= 0) m += 1440; return m / 60; };  // overnight-aware
const fmtHM = (h) => (h == null ? "—" : `${Math.floor(h)}h ${Math.round((h - Math.floor(h)) * 60)}m`);
// ── Gemini client ── two paths: (a) DIRECT browser call with the user's free AI Studio key (the API is CORS-open
// with x-goog-api-key; the key lives ONLY in synced private data + localStorage, never in this public page),
// (b) legacy user-owned Worker proxy. Test hook: window.__mockGemini.
const GEMINI_MODEL = "gemini-2.5-flash";
const hasAI = (ai) => !!(ai && (ai.geminiKey || ai.proxyUrl));
// Per-task prompts (ported from docs/gemini-proxy/worker.js so direct + proxy return identical JSON shapes).

/* ───────────────────────── value wheel ───────────────────────── */
// Vertical swipe wheel: drag up = +, 24px per step; flick adds momentum steps; tap (no movement) = type
// exact. Touch handlers are attached imperatively (ref + useEffect, { passive: false }) because React's
// synthetic onTouchMove can't preventDefault reliably — without that the page scrolls mid-swipe. The
// gesture mirrors FocusPager's own direction lock (8px, whichever axis leads wins) and only claims the
// touch (preventDefault + stopPropagation) once it's decided vertical; a mostly-horizontal drag is left
// untouched so it still reaches the pager and pages normally.
function ValueWheel({ value, onStep, onSetExact, fmt, label, suffix, peekUp, peekDn, disabled, resetKey, noFlick }) {
  const [editing, setEditing] = useState(false);
  const [txt, setTxt] = useState("");

  const elRef = useRef(null);
  const onStepRef = useRef(onStep); onStepRef.current = onStep;
  const valueRef = useRef(value); valueRef.current = value;
  const disabledRef = useRef(disabled); disabledRef.current = disabled;
  const cancelled = useRef(false);
  const suppressClick = useRef(false);   // a claimed vertical swipe can emit a trailing synthetic click — swallow it
  const F = fmt || ((v) => v);
  const fmtRef = useRef(F); fmtRef.current = F;
  const editingRef = useRef(editing); editingRef.current = editing;
  // single entry point for tap-to-type (touch tap AND desktop mouse click) — seeds with the DISPLAY
  // value (same thing the wheel renders) so the commit path converts display→stored exactly once.
  const openEditor = () => { if (disabledRef.current || editingRef.current) return; setTxt(String(fmtRef.current(valueRef.current))); setEditing(true); };

  useEffect(() => { setEditing(false); }, [resetKey]);   // switching to a different set row cancels any in-progress edit

  useEffect(() => {
    if (editing) return;   // wheel div is unmounted while editing — re-run on close so listeners bind to the FRESH node
    const el = elRef.current;
    if (!el) return;
    const onTS = (e) => { if (disabledRef.current) return; const t = e.touches[0]; g.current = { x: t.clientX, y: t.clientY, t: Date.now(), acc: 0, moved: false, lock: null }; };
    const onTM = (e) => {
      const s = g.current; if (!s) return;
      const t = e.touches[0];
      const dx = t.clientX - s.x, dy = s.y - t.clientY;   // dy: up = positive
      if (s.lock == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) s.lock = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
      s.moved = s.moved || Math.abs(dx) > 6 || Math.abs(dy) > 6;
      if (s.lock !== "y") return;   // horizontal or still undecided — let it fall through to the pager untouched
      e.preventDefault(); e.stopPropagation();
      const steps = Math.trunc(dy / 24) - s.acc;
      if (steps !== 0) { s.acc += steps; for (let i = 0; i < Math.abs(steps); i++) onStepRef.current(steps > 0 ? 1 : -1); }
    };
    const onTE = (e) => {
      const s = g.current; g.current = null; if (!s) return;
      if (s.lock === "y") { e.stopPropagation(); suppressClick.current = true; }   // gesture claimed — swallow the trailing synthetic click
      if (!s.moved) { openEditor(); return; }
      const dt = Date.now() - s.t, v = s.acc / Math.max(1, dt);           // steps per ms
      // flick momentum — disabled for short-range wheels (band bars: 0–10) where an 8-step overshoot
      // turns "set 2" into "set 8"; those step exactly what the finger dragged.
      const extra = noFlick ? 0 : Math.min(8, Math.round(Math.abs(v) * 220));
      for (let i = 0; i < extra; i++) onStepRef.current(s.acc > 0 ? 1 : -1);

      el.removeEventListener("touchstart", onTS);
      el.removeEventListener("touchmove", onTM);
      el.removeEventListener("touchend", onTE);
    };
  }, [editing]);   // re-attach after each edit closes; onStep/value/disabled/fmt are read via refs so the listeners never go stale

  if (editing) return (
    <input autoFocus type="number" inputMode="decimal" value={txt} aria-label={label}
      onChange={(e) => setTxt(e.target.value)}
      onBlur={() => { if (cancelled.current) { cancelled.current = false; setEditing(false); return; } const n = parseFloat(txt); if (!isNaN(n)) onSetExact(n); setEditing(false); }}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); else if (e.key === "Escape") { cancelled.current = true; e.currentTarget.blur(); } }}
      className="w-[72px] rounded-lg border px-1 py-2 text-center font-mono text-[18px] font-bold outline-none"
      style={{ background: "#100E09", borderColor: C.goldDim, color: C.bone }} />
  );
  return (
    <div ref={elRef} className="select-none touch-none rounded-lg border px-2 py-0.5 text-center" style={{ borderColor: C.edge, background: "#100E09", minWidth: 72, opacity: disabled ? 0.45 : 1 }}
      onClick={() => { if (suppressClick.current) { suppressClick.current = false; return; } openEditor(); }}   // desktop mouse path — touch taps land here too but openEditor no-ops once editing
      role="spinbutton" aria-label={label} aria-valuenow={F(value)}>
      <div className="font-mono text-[11px] leading-tight" style={{ color: C.ashDim, opacity: 0.55 }}>{peekUp}</div>
      <div className="font-mono text-[19px] font-bold leading-tight" style={{ color: C.bone }}>{F(value)}{suffix ? <span className="text-[10px]" style={{ color: C.ashDim }}> {suffix}</span> : null}</div>
      <div className="font-mono text-[11px] leading-tight" style={{ color: C.ashDim, opacity: 0.55 }}>{peekDn}</div>
    </div>
  );
}
