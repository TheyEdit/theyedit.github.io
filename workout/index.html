            style={{ borderColor: C.edge, color: C.gold }}>
            <Link2 size={18} />
          </button>
        )}
        <button onClick={() => setOpenInfo(openInfo === exIdx ? null : exIdx)} aria-label={`${openInfo === exIdx ? "hide" : "show"} form animation`} className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border active:scale-90"
          style={{ borderColor: openInfo === exIdx ? C.goldDim : C.edge, color: openInfo === exIdx ? C.gold : C.ash }}>
          <Info size={18} />
        </button>
        <button onClick={() => toggleSkip(exIdx)} aria-label={`skip ${item.ex.name} today`} title="skip this exercise today" className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border active:scale-90"
          style={{ borderColor: C.edge, color: C.ash }}>
          <SkipForward size={18} />
        </button>
      </div>

      {openInfo === exIdx && (
        <div className="mt-3 rounded-xl border px-3 py-2" style={{ borderColor: C.activeEdge, background: "#15120A", animation: "fade .25s ease-out" }}>
          <ExerciseAnim kind={ANIM[item.ex.name] || "press"} />
          <p className="mt-1 text-center font-mono text-[10px] uppercase tracking-[0.15em]" style={{ color: C.ashDim }}>{item.ex.name}</p>
          <p className="mt-2 text-[12.5px] leading-relaxed" style={{ color: C.ash }}>{item.ex.basic}</p>
        </div>
      )}

      {item.ex.variantSlot && (
        <div className="mt-3">
          <div className="grid grid-cols-2 gap-1.5">
            {item.ex.variants.map((v, vi) => {
              const onv = item.ex.slotIndex === vi;
              return (
                <button key={v.name} aria-label={`select ${v.name}`} onClick={() => !exLocked && setVariant(item.ex.slotKey, vi)} disabled={exLocked && !onv}
                  className="rounded-lg border px-2 py-2.5 font-mono text-[12px]"
                  style={{ borderColor: onv ? C.goldDim : C.edge, background: onv ? "#241F12" : "transparent", color: onv ? C.gold : C.ash, opacity: exLocked && !onv ? 0.35 : 1 }}>
                  {SHORT[v.name] || v.name}
                </button>
              );
            })}
          </div>
          {exLocked && <p className="mt-1 font-mono text-[9px]" style={{ color: C.ashDim }}>locked — this exercise has started</p>}
        </div>
      )}

      {!item.ex.repProgress && (
        <div className="mt-3 flex items-center justify-between gap-2 rounded-xl border px-3 py-1.5" style={{ borderColor: C.edge }}>
          <span className="font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>dumbbells</span>
          <DbToggle count={cnt} onSet={(n) => setDbMode(item.ex.name, n)} />
        </div>
      )}
      {bars > 0 && bandFactor(item.ex, cnt) > 0 && (
        <p className="mt-1.5 font-mono text-[10px]" style={{ color: C.ashDim }}>+ {bars} bars · {dispW1(bars * BAR_LB * bandFactor(item.ex, cnt), unit)} {uw(unit)}</p>
      )}

      <div className="mt-3 space-y-2">
        {item.sets.map((set, setIdx) => renderSetRow(exIdx, setIdx))}
      </div>

      <p className="mt-3 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>
        {joined && item.pair.role === "A" ? (
          <>superset with {plan[item.pair.partnerIdx]?.ex.name} · no rest → partner</>
        ) : joined && item.pair.role === "B" ? (
          <>superset · rest {fmtRest(item.pair.postRest)} after each round</>
        ) : (
          <>
            {item.ex.type === "rpt" ? "reverse pyramid · −10% per set · rest " : "straight sets · rest "}{fmtRest(item.ex.rest)}
            {exIdx === 0 && item.ex.type === "rpt" ? " · warm-up ramp first" : exIdx === 1 && item.ex.type === "rpt" ? " · one ramp set" : ""}
          </>
        )}
      </p>
    </div>
    );
  };
  // compact per-exercise strip column for the merged card: name/badges, variant picker, dbMode toggle,
  // and the type/rest "prescription" line — the same pieces renderExerciseCard shows, condensed to fit
  // side-by-side (A left, B right).
  const renderPairStripCol = (exIdx) => {
    const it = plan[exIdx];
    const px = `${exIdx}-`;
    const exLocked = (active && active.startsWith(px)) || (rest && rest.key.startsWith(px)) || [...done].some((k) => k.startsWith(px));
    const chg = mem.lastChanges?.[it.ex.name];
    const cnt = dbCount(mem, it.ex);
    const workSets = it.sets.filter((s) => s.kind === "work");
    const first = workSets[0];
    const [rxBot, rxTop] = first?.range || [null, null];
    const rx = !first ? "" : it.ex.repProgress
      ? `${workSets.length} × (${rxBot}–${rxTop})`
      : `${workSets.length} × ${dispW(first.load, unit)}${uw(unit)}${cnt === 2 ? "/hand" : ""} (${rxBot}–${rxTop})${cnt === 1 ? " · 1 DB" : ""}`;
    return (
      <div key={exIdx} className="min-w-0 flex-1" style={{ opacity: skippedEx.has(exIdx) ? 0.5 : 1 }}>
        <p className="truncate text-[13px] font-semibold leading-tight" style={{ color: C.bone, fontFamily: "Georgia, serif" }}>{it.ex.name}</p>
        <div className="mt-1 flex flex-wrap items-center gap-1.5">
          {it.ex.optional && <span className="font-mono text-[9px] uppercase tracking-wider" style={{ color: C.ashDim }}>optional</span>}
          {(mem.stalls?.[it.ex.name] || 0) >= 2 && <span className="font-mono text-[9px] uppercase tracking-wider" style={{ color: C.rust }}>stalling</span>}
          {chg && chg.toLoad !== chg.fromLoad && (
            <span className="flex items-center gap-1 font-mono text-[9px]" style={{ color: chg.toLoad > chg.fromLoad ? C.sage : C.rust }}>
              {chg.toLoad > chg.fromLoad ? <TrendingUp size={9} /> : <TrendingDown size={9} />} {dispW(chg.toLoad, unit)}
            </span>
          )}
        </div>
        {it.ex.variantSlot && (
          <div className="mt-1.5 grid grid-cols-2 gap-1">
            {it.ex.variants.map((v, vi) => {
              const onv = it.ex.slotIndex === vi;
              return (
                <button key={v.name} aria-label={`select ${v.name}`} onClick={() => !exLocked && setVariant(it.ex.slotKey, vi)} disabled={exLocked && !onv}
                  className="rounded-lg border px-2 py-2 font-mono text-[11px]"
                  style={{ borderColor: onv ? C.goldDim : C.edge, background: onv ? "#241F12" : "transparent", color: onv ? C.gold : C.ash, opacity: exLocked && !onv ? 0.35 : 1 }}>
                  {SHORT[v.name] || v.name}
                </button>
              );
            })}
          </div>
        )}
        {!it.ex.repProgress && (
          <div className="mt-1.5">
            <DbToggle count={cnt} onSet={(n) => setDbMode(it.ex.name, n)} />
          </div>
        )}
        {bars > 0 && bandFactor(it.ex, cnt) > 0 && (
          <p className="mt-1 font-mono text-[9px]" style={{ color: C.ashDim }}>+ {bars} bars · {dispW1(bars * BAR_LB * bandFactor(it.ex, cnt), unit)} {uw(unit)}</p>
        )}
        <p className="mt-1.5 font-mono text-[10px]" style={{ color: C.ashDim }}>{rx}</p>
        <button onClick={() => toggleSkip(exIdx)} className="mt-1.5 flex min-h-[36px] items-center gap-1 font-mono text-[10px] uppercase tracking-wider active:scale-95"
          style={{ color: skippedEx.has(exIdx) ? C.gold : C.ashDim }}>
          {skippedEx.has(exIdx) ? <>restore</> : <><SkipForward size={11} /> skip today</>}
        </button>
      </div>
    );
  };

  // merged superset card (Task 4): one card for an ACTIVE pair, rows sequenced in the true execution
  // order (Task 1's seqKeys rule reproduced here from `plan` alone: A/B warmups first, then A/B work
  // interleaved round-by-round). Completed rounds collapse to one line; tapping re-expands them.
  const renderPairCard = (u) => {
    const [a, b] = u.idxs;
    const A = plan[a], B = plan[b];
    const warmOf = (ei) => plan[ei].sets.map((s, si) => si).filter((si) => plan[ei].sets[si].kind === "warmup");
    const workOf = (ei) => plan[ei].sets.map((s, si) => si).filter((si) => plan[ei].sets[si].kind === "work");
    const warmA = warmOf(a), warmB = warmOf(b);
    const wa = workOf(a), wb = workOf(b);
    const rounds = Array.from({ length: Math.max(wa.length, wb.length) }, (_, r) => ({ r, aSi: wa[r] ?? null, bSi: wb[r] ?? null }));
    const curKeyNow = active || (rest && rest.key) || nextKey;
    const fmtSide = (ei, lg) => {
      const it = plan[ei], c = dbCount(mem, it.ex);
      const bT = bars * BAR_LB * bandFactor(it.ex, c);
      return it.ex.repProgress ? `${lg.reps} reps` : `${c === 1 ? dispW1(lg.weight + bT, unit) : dispW1(lg.weight * 2 + bT, unit)}${uw(unit)}${c === 1 ? "" : " total"} × ${lg.reps}`;
    };
    return (
      <div key={`${A.ex.name}×${B.ex.name}`} className="rounded-2xl border p-5" style={{ background: C.card, borderColor: C.edge }}>
        <div className="flex items-start gap-3">
          <span className="font-mono text-xs" style={{ color: C.gold }}>{String(a + 1).padStart(2, "0")}</span>
          <div className="flex-1">
            <h3 className="text-[17px] font-semibold leading-tight" style={{ color: C.bone, fontFamily: "Georgia, serif" }}>{A.ex.name} × {B.ex.name}</h3>
            <p className="mt-1 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.gold }}>superset · no rest inside the round</p>
          </div>
          <button onClick={() => setOpenInfo(openInfo === a ? null : a)} aria-label={`${openInfo === a ? "hide" : "show"} form animations`} className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border active:scale-90"
            style={{ borderColor: openInfo === a ? C.goldDim : C.edge, color: openInfo === a ? C.gold : C.ash }}>
            <Info size={18} />
          </button>
          <button onClick={() => breakPair(A.pair.id)} aria-label="break superset pairing" title="split into two straight-set cards" className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border active:scale-90"
            style={{ borderColor: C.edge, color: C.ash }}>
            <Unlink size={18} />
          </button>
        </div>

        {openInfo === a && (
          <div className="mt-3 space-y-2" style={{ animation: "fade .25s ease-out" }}>
            {[a, b].map((idx) => (
              <div key={idx} className="rounded-xl border px-3 py-2" style={{ borderColor: C.activeEdge, background: "#15120A" }}>
                <ExerciseAnim kind={ANIM[plan[idx].ex.name] || "press"} />
                <p className="mt-1 text-center font-mono text-[10px] uppercase tracking-[0.15em]" style={{ color: C.ashDim }}>{plan[idx].ex.name}</p>
                <p className="mt-2 text-[12.5px] leading-relaxed" style={{ color: C.ash }}>{plan[idx].ex.basic}</p>
              </div>
            ))}
          </div>
        )}

        <div className="mt-3 flex gap-3">
          {renderPairStripCol(a)}
          {renderPairStripCol(b)}
        </div>

        <div className="mt-4 space-y-2">
          {!skippedEx.has(a) && warmA.map((si) => renderSetRow(a, si, { name: rowName(A.ex.name) }))}
          {!skippedEx.has(b) && warmB.map((si) => renderSetRow(b, si, { name: rowName(B.ex.name) }))}
          {rounds.map((rd) => {
            const keyA = rd.aSi != null && !skippedEx.has(a) ? `${a}-${rd.aSi}` : null;   // a skipped half's rows drop out of the round
            const keyB = rd.bSi != null && !skippedEx.has(b) ? `${b}-${rd.bSi}` : null;
            if (!keyA && !keyB) return null;
            const doneA = keyA ? done.has(keyA) : true;
            const doneB = keyB ? done.has(keyB) : true;
            const complete = doneA && doneB;
            const isCurrent = (keyA && keyA === curKeyNow) || (keyB && keyB === curKeyNow);
            const rk = `${a}-r${rd.r}`;
            if (complete && !reopenedRounds.has(rk)) {
              return (
                <button key={rk} onClick={() => setReopenedRounds((s) => new Set(s).add(rk))} aria-label={`expand round ${rd.r + 1}`}
                  className="flex min-h-[44px] w-full items-center justify-between gap-2 rounded-xl border px-3 py-2 active:scale-95" style={{ borderColor: C.edge }}>
                  <span className="flex shrink-0 items-center gap-1.5 font-mono text-[12px]" style={{ color: C.sage }}><Check size={13} /> R{rd.r + 1}</span>
                  <span className="truncate font-mono text-[12px]" style={{ color: C.ash }}>
                    {keyA ? fmtSide(a, logs[keyA] ?? {}) : ""}{keyA && keyB ? " · " : ""}{keyB ? fmtSide(b, logs[keyB] ?? {}) : ""}
                  </span>
                </button>
              );
            }
            return (
              <div key={rk} style={{ opacity: !complete && !isCurrent ? 0.5 : 1 }}>
                <p className="mb-1 mt-2 font-mono text-[10px] uppercase tracking-[0.2em]" style={{ color: C.goldDim }}>Round {rd.r + 1}</p>
                {keyA && renderSetRow(a, rd.aSi, { name: rowName(A.ex.name) })}
                {keyB && renderSetRow(b, rd.bSi, { name: rowName(B.ex.name) })}
              </div>
            );
          })}
        </div>
        <p className="mt-3 font-mono text-[10px]" style={{ color: C.ashDim }}>rest {fmtRest(A.pair.postRest)} after each round</p>
      </div>
    );
  };

  // renderUnit: a unit is either a single exercise or an ACTIVE superset pair — pairs get the merged
  // card (Task 4); a broken pair unitizes into two singles, each rendered "compact" (session look,
  // with a Link2 restore icon instead of the pre-session banner).
  const renderUnit = (u) => u.pair
    ? renderPairCard(u)
    : renderExerciseCard(u.idxs[0], { compact: true });

  if (!loaded) return (
    <div className="flex min-h-screen w-full items-center justify-center" style={{ background: C.bg }}>
      <span className="font-mono text-xs uppercase tracking-[0.2em]" style={{ color: C.ashDim }}>loading your program…</span>
    </div>
  );

  return (
    <div className="min-h-screen w-full" style={{ background: C.bg, color: C.bone }}>
      <style>{`@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
        @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
        .ggwrap{position:relative;width:140px;height:140px;margin:0 auto}
        .ggfig{position:absolute;inset:0}
        .ggground{position:absolute;left:30px;right:30px;bottom:14px;height:2px;background:#2A2418;border-radius:2px}
        .gglegs,.ggbody{position:absolute;left:70px;top:96px;width:0;height:0;transform-origin:0 0}
        .ggleg{position:absolute;left:0;top:0;width:3px;height:30px;background:#6E5A1E;border-radius:2px;transform-origin:top center}
        .ggleg.b{transform:rotate(13deg)}.ggleg.f{transform:rotate(-13deg)}
        .ggtorso{position:absolute;left:-2px;top:-44px;width:4px;height:44px;background:#C9A227;border-radius:2px}
        .gghead{position:absolute;left:-9px;top:-62px;width:18px;height:18px;border:3px solid #C9A227;border-radius:50%;box-sizing:border-box}
        .ggarm{position:absolute;left:0;top:-44px;width:0;height:0;transform-origin:0 0;transform:rotate(80deg)}
        .ggupper{position:absolute;left:0;top:-2px;width:20px;height:4px;background:#C9A227;border-radius:2px}
        .ggelbow{position:absolute;left:20px;top:0;width:0;height:0;transform-origin:0 0;transform:rotate(0deg)}
        .ggfore{position:absolute;left:0;top:-2px;width:18px;height:4px;background:#C9A227;border-radius:2px}
        .ggdb{position:absolute;left:15px;top:-5px;width:11px;height:11px;background:#ECE6D8;border-radius:2px}
        @keyframes uaPress{from{transform:rotate(18deg)}to{transform:rotate(-76deg)}}
        @keyframes faPress{from{transform:rotate(-72deg)}to{transform:rotate(-8deg)}}
        @keyframes faCurl{from{transform:rotate(4deg)}to{transform:rotate(-150deg)}}
        @keyframes uaRaise{from{transform:rotate(82deg)}to{transform:rotate(4deg)}}
        @keyframes uaRow{from{transform:rotate(60deg)}to{transform:rotate(116deg)}}
        @keyframes faRow{from{transform:rotate(0deg)}to{transform:rotate(-46deg)}}
        @keyframes faExtend{from{transform:rotate(-80deg)}to{transform:rotate(-6deg)}}
        @keyframes uaPull{from{transform:rotate(-64deg)}to{transform:rotate(-152deg)}}
        @keyframes bodyHinge{from{transform:rotate(0deg)}to{transform:rotate(52deg)}}
        @keyframes calfBob{from{transform:translateY(2px)}to{transform:translateY(-8px)}}
        @keyframes squatDip{from{transform:translateY(-2px)}to{transform:translateY(13px)}}
        @keyframes legB{from{transform:rotate(13deg)}to{transform:rotate(33deg)}}
        @keyframes legF{from{transform:rotate(-13deg)}to{transform:rotate(-33deg)}}
        @keyframes situpUp{from{transform:rotate(-66deg)}to{transform:rotate(-16deg)}}
        @keyframes legsUp{from{transform:rotate(2deg)}to{transform:rotate(-64deg)}}
        .ggfig .ggarm,.ggfig .ggelbow,.ggfig .ggbody{animation-duration:2.2s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
        .press .ggarm{animation-name:uaPress}.press .ggelbow{animation-name:faPress}
        .curl .ggarm{transform:rotate(84deg)}.curl .ggelbow{animation-name:faCurl}
        .raise .ggarm{animation-name:uaRaise}.raise .ggelbow{transform:rotate(-6deg)}
        .row .ggarm{animation-name:uaRow}.row .ggelbow{animation-name:faRow}.row .ggbody{transform:rotate(28deg)}
        .extend .ggarm{transform:rotate(-82deg)}.extend .ggelbow{animation-name:faExtend}
        .pullover .ggarm{animation-name:uaPull}.pullover .ggelbow{transform:rotate(-6deg)}
        .hinge .ggbody{animation-name:bodyHinge}
        .fly .ggarm{animation-name:uaRaise}.fly .ggelbow{transform:rotate(-6deg)}.fly .ggbody{transform:rotate(44deg)}
        .calf .ggfig,.ggfig.calf{animation:calfBob 1.4s ease-in-out infinite alternate}
        .ggfig.squat{animation:squatDip 2s ease-in-out infinite alternate}
        .squat .ggleg.b{animation:legB 2s ease-in-out infinite alternate}
        .squat .ggleg.f{animation:legF 2s ease-in-out infinite alternate}
        .situp .ggbody{animation-name:situpUp}
        .legraise .ggbody{transform:rotate(-72deg)}
        .legraise .gglegs{animation:legsUp 2s ease-in-out infinite alternate}
        .vup .ggbody{animation-name:situpUp}
        .vup .gglegs{animation:legsUp 2s ease-in-out infinite alternate}
        .recline .ggbody{transform:rotate(-24deg)}`}</style>
      <div className="mx-auto max-w-md px-5 pb-24 pt-8" style={{ paddingBottom: "calc(6rem + env(safe-area-inset-bottom))", paddingLeft: "max(1.25rem, env(safe-area-inset-left))", paddingRight: "max(1.25rem, env(safe-area-inset-right))" }}>
        {tab === "workout" && !summary && !pending && (
          <div className="sticky top-0 z-20 -mx-5 mb-4 px-5 py-2" style={{ background: "rgba(14,13,11,0.93)", backdropFilter: "blur(6px)", borderBottom: `1px solid ${C.edge}`, paddingTop: "calc(0.5rem + env(safe-area-inset-top))" }}>
            <PlayerBar plan={plan} active={active} rest={rest} restLeft={restLeft} logs={logs} mem={mem} unit={unit} busy={busy} nextKey={nextKey}
              startSet={startSet} finishSet={finishSet} cancelSet={cancelSet} skipRest={skipRest} addRest={addRest} pauseRest={pauseRest} resumeRest={resumeRest} setConfirm={setConfirm} />
            {sessionStarted && (
              <>
                <div className="mt-1.5 flex items-center justify-between font-mono text-xs uppercase tracking-wider">
                  <span style={{ color: C.gold }}>Day {day} · in progress</span>
                  <span style={{ color: C.ash }}>{workDone} / {workTotal} sets</span>
                </div>
                <div className="mt-1.5 h-1.5 w-full overflow-hidden rounded-full" style={{ background: "#2A2418" }}>
                  <div className="h-full rounded-full" style={{ width: `${workTotal ? (workDone / workTotal) * 100 : 0}%`, background: C.gold, transition: "width .4s ease" }} />
                </div>
              </>
            )}
          </div>
        )}
        {tab === "workout" && !summary && !pending && sessionStarted && (
          <div className="-mt-1 mb-4 flex justify-end">
            <button onClick={() => setReviewOpen(true)} className="flex h-11 items-center gap-1.5 rounded-full border px-4 font-mono text-[11px] uppercase tracking-wider active:scale-95" style={{ borderColor: C.edge, color: C.ash, background: C.card }}>
              <List size={14} /> review day
            </button>
          </div>
        )}
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Dumbbell size={15} style={{ color: C.gold }} />
            <span className="font-mono text-[11px] uppercase tracking-[0.2em]" style={{ color: C.ash }}>Greek God · Coach</span>
          </div>
          <span className="font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>Session {(mem.sessionCount || 0) + 1}</span>
        </div>

        <div className="mt-5 inline-flex rounded-full border p-1" style={{ borderColor: C.edge, background: C.card }}>
          {[["workout", "Workout", Dumbbell], ["diet", "Diet", Apple], ["cardio", "Cardio", Activity]].map(([t, lab, Icon]) => (
            <button key={t} onClick={() => { setTab(t); setOpenInfo(null); }} className="flex items-center gap-1.5 rounded-full px-5 py-2.5 font-mono text-sm active:scale-95"
              style={{ background: tab === t ? C.gold : "transparent", color: tab === t ? C.bg : C.ash, fontWeight: tab === t ? 700 : 400 }}>
              <Icon size={16} />{lab}{t === "workout" && sessionStarted && <span style={{ width: 6, height: 6, borderRadius: 9, background: tab === t ? C.bg : C.gold, display: "inline-block" }} />}
            </button>
          ))}
        </div>

        {tab === "workout" && (<>
        {pending && (
          <div className="mt-5 rounded-xl border p-4" style={{ borderColor: C.activeEdge, background: "#1A1609", animation: "fade .4s ease-out" }}>
            <p className="font-mono text-[10px] uppercase tracking-[0.2em]" style={{ color: C.gold }}>In-progress session found</p>
            <p className="mt-2 text-[13px]" style={{ color: C.bone }}>You have an unfinished Day {pending.day} — {pending.done.length > 0 ? `${pending.done.length} set${pending.done.length === 1 ? "" : "s"} logged` : "a set in progress"}. Pick up where you left off?</p>
            <div className="mt-3 flex gap-2">
              <button onClick={resumeSession} className="flex-1 rounded-xl py-3 font-mono text-sm font-bold uppercase tracking-wider" style={{ background: C.gold, color: C.bg }}>Resume</button>
              <button onClick={discardSession} className="flex-1 rounded-xl border py-3 font-mono text-sm uppercase tracking-wider" style={{ borderColor: C.edge, color: C.ash }}>Discard</button>
            </div>
          </div>
        )}

        {/* honest assessment after finishing */}
        {summary && (() => {
          const a = summary.assessment || { tone: "yellow", text: "", rows: [], strengthPct: null, volumePct: null };
          const toneC = a.tone === "green" ? C.sage : a.tone === "red" ? C.rust : C.gold;
          const decLabel = { "add-load": "+ load", "add-load-overdue": "+ load · overdue", "add-rep": "+1 rep goal", "hold": "repeat — slipped", "hold-effort": "hold — high effort", "deload": "deload", "skip": "—" };
          const byName = {}; (summary.changes || []).forEach((c) => { byName[c.name] = c; });
          return (
          <div className="mt-5 rounded-xl border p-4" style={{ borderColor: C.activeEdge, background: "#1A1609", animation: "fade .4s ease-out" }}>
            <p className="font-mono text-[10px] uppercase tracking-[0.2em]" style={{ color: C.gold }}>Day {summary.day} saved</p>
            <p className="mt-2 text-[14px] font-semibold leading-snug" style={{ color: toneC }}>{a.text}</p>
            {(a.strengthPct != null || a.volumePct != null) && (
              <div className="mt-2 flex gap-4">
                {a.strengthPct != null && <div><p className="font-mono text-[9px] uppercase tracking-wider" style={{ color: C.ashDim }}>hard-set strength</p><p className="font-mono text-lg" style={{ color: a.strengthPct >= 0 ? C.sage : C.rust }}>{a.strengthPct >= 0 ? "+" : ""}{a.strengthPct.toFixed(1)}%</p></div>}
                {a.volumePct != null && <div><p className="font-mono text-[9px] uppercase tracking-wider" style={{ color: C.ashDim }}>volume</p><p className="font-mono text-lg" style={{ color: a.volumePct >= 0 ? C.sage : C.rust }}>{a.volumePct >= 0 ? "+" : ""}{a.volumePct.toFixed(0)}%</p></div>}
              </div>
            )}
            <div className="mt-3 space-y-1">
              {a.rows.map((r) => { const c = byName[r.name]; return (
                <div key={r.name} className="flex items-center justify-between gap-2 text-[12px]" style={{ color: C.bone }}>
                  <span className="flex items-center gap-1.5 min-w-0">
                    {r.dir === "up" ? <TrendingUp size={12} style={{ color: C.sage }} /> : r.dir === "down" ? <TrendingDown size={12} style={{ color: C.rust }} /> : <span style={{ width: 12 }} />}
                    <span className="truncate">{r.name}</span>
                  </span>
                  <span className="font-mono shrink-0" style={{ color: C.ash }}>
                    {r.pct != null ? `${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(1)}%` : "new"}{c ? ` · ${decLabel[c.decision] || c.decision}` : ""}{c && c.rebased && c.toLoad > c.fromLoad ? " · new standard" : ""}{c && c.setPBs ? ` · ${c.setPBs} set PB${c.setPBs > 1 ? "s" : ""}` : ""}
                  </span>
                </div>
              ); })}
            </div>
            <button onClick={() => setSummary(null)} className="mt-3 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.goldDim }}>dismiss</button>
          </div>
          ); })()}

        <p className="mt-6 font-mono text-[11px] uppercase tracking-[0.2em]" style={{ color: C.ashDim }}>{today}</p>
        <h1 className="mt-1 text-4xl font-bold leading-none" style={{ color: C.bone, fontFamily: "Georgia, serif" }}>Day {day}</h1>
        <p className="mt-2 text-sm" style={{ color: C.ash }}>{dayMeta(day).focus} — <span style={{ color: C.ashDim }}>{dayMeta(day).sub}</span></p>
        <div className="mt-3 flex items-center gap-2">
          <Clock size={13} style={{ color: C.gold }} />
          <span className="font-mono text-xs" style={{ color: C.ash }}>≈ {estMin} min</span>
          <span style={{ color: C.ashDim }}>·</span>
          <span className="font-mono text-xs" style={{ color: C.ash }}>{plan.length} exercises</span>
        </div>

        <div className="mt-5 flex flex-wrap items-center gap-2">
          <div className="inline-flex rounded-full border p-1" style={{ borderColor: C.edge, background: C.card }}>
            {PROGRAM.map((d) => (
              <button key={d.id} onClick={() => { setDay(d.id); setOpenInfo(null); setConfirm(null); if (hasStore) clearLive(); liveRef.current = null; liveClearedRef.current = true; }} className="flex min-w-[42px] items-center justify-center gap-1 rounded-full px-3 py-2 font-mono text-sm"
                style={{ background: day === d.id ? C.gold : "transparent", color: day === d.id ? C.bg : C.ash, fontWeight: day === d.id ? 700 : 400 }}>
                {d.id}
              </button>
            ))}
          </div>
          <div className="inline-flex rounded-full border p-1" style={{ borderColor: C.edge, background: C.card }}>
            {["lb", "kg"].map((u) => (
              <button key={u} onClick={() => setUnit(u)} aria-label={`show weights in ${u === "lb" ? "pounds" : "kilograms"}`} className="rounded-full px-4 py-2 font-mono text-sm"
                style={{ background: unit === u ? C.gold : "transparent", color: unit === u ? C.bg : C.ash, fontWeight: unit === u ? 700 : 400 }}>{u}</button>
            ))}
          </div>
        </div>
        {mem.lastDay > 0 && day === nextDayId(mem.lastDay) && <p className="mt-2 font-mono text-[10px]" style={{ color: C.ashDim }}>auto-picked — you trained Day {mem.lastDay} last</p>}

        {!summary && !pending && bandableDay && (
          <div className="mb-3 mt-5 flex items-center justify-between rounded-2xl border px-4 py-2.5" style={{ background: C.card, borderColor: C.edge }}>
            <div className="min-w-0">
              <p className="font-mono text-[10px] uppercase tracking-[0.2em]" style={{ color: C.ash }}>arm bands</p>
              <p className="mt-0.5 font-mono text-[11px]" style={{ color: C.ashDim }}>{bars * 200} g/arm{sessionStarted ? " · sets record the bars they're done with" : ` · ${suggest.why}`}</p>
            </div>
            <ValueWheel value={bars} label="band bars" noFlick resetKey={`band-${day}`}
              onStep={(d) => setSessionBars(Math.max(0, Math.min(10, bars + d)))}
              onSetExact={(v) => setSessionBars(Math.max(0, Math.min(10, Math.round(v))))}
              peekUp={String(Math.min(10, bars + 1))} peekDn={String(Math.max(0, bars - 1))} />
          </div>
        )}

        <div className="mt-6 space-y-4">
          {sessionStarted ? (
            <>
              <FocusPager count={units.length} page={pageClamped} onPage={setPage}>
                {(i) => renderUnit(units[i])}
              </FocusPager>
              <div className="flex items-center justify-center gap-1.5" style={{ minHeight: 44 }}>
                {units.map((u, i) => {
                  const complete = u.idxs.every((ei) => plan[ei].sets.every((s, si) => done.has(`${ei}-${si}`)));
                  return (
                    <button key={i} onClick={() => setPage(i)} aria-label={`go to exercise ${i + 1}`} className="flex h-11 w-6 shrink-0 items-center justify-center active:scale-90">
                      <span style={{ width: 8, height: 8, borderRadius: 9, background: i === pageClamped ? C.gold : complete ? C.sage : C.ashDim, opacity: i === pageClamped ? 1 : complete ? 0.9 : 0.4 }} />
                    </button>
                  );
                })}
              </div>
            </>
          ) : (
            plan.map((_, exIdx) => renderExerciseCard(exIdx))
          )}
        </div>

        {/* finish + progress */}
        <div id="finishzone" />
        {confirm === "finish" ? (
          <div className="mt-6 rounded-2xl border p-4" style={{ borderColor: C.activeEdge, background: "#1A1609", animation: "fade .3s ease-out" }}>
            <p className="text-[13px] leading-relaxed" style={{ color: C.bone }}>Finish Day {day}? This saves your {workDone} logged set{workDone === 1 ? "" : "s"}, applies progression, and advances to the next day.</p>
            <div className="mt-3 flex gap-2">
              <button onClick={() => setConfirm(null)} className="flex-1 rounded-xl border py-3 font-mono text-xs uppercase tracking-wider" style={{ borderColor: C.edge, color: C.ash }}>Cancel</button>
              <button onClick={() => { setConfirm(null); finishWorkout(); }} className="flex flex-1 items-center justify-center gap-2 rounded-xl py-3 font-mono text-xs font-bold uppercase tracking-wider" style={{ background: C.gold, color: C.bg }}><Save size={15} /> Finish &amp; save</button>
            </div>
          </div>
        ) : (
          <button onClick={() => workDoneCount > 0 && setConfirm("finish")} disabled={workDoneCount === 0}
            className="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl py-4 font-mono text-sm font-bold uppercase tracking-wider"
            style={{ background: workDoneCount === 0 ? C.card : C.gold, color: workDoneCount === 0 ? C.ashDim : C.bg, opacity: workDoneCount === 0 ? 0.6 : 1 }}>
            <Save size={16} /> Finish workout · save & progress
          </button>
        )}

        <ProgressChart mem={mem} />

        <div className="mt-6 rounded-2xl border p-5" style={{ background: C.card, borderColor: C.edge }}>
          <span className="font-mono text-[11px] uppercase tracking-[0.2em]" style={{ color: C.ash }}>Strength standards</span>

          {bw ? (
            <p className="mt-2 font-mono text-[11px]" style={{ color: C.ash }}>bodyweight <span style={{ color: C.bone }}>{unit === "kg" ? Math.round(bw * KG * 10) / 10 : bw} {uw(unit)}</span> <span style={{ color: C.ashDim }}>· edit in the Diet tab</span></p>
          ) : null}

          {!bw ? (
            <p className="mt-4 text-[12.5px] leading-relaxed" style={{ color: C.ash }}>Set your bodyweight in the <span style={{ color: C.gold }}>Diet</span> tab to see where your lifts land against the Good / Great / Godlike standards — relative strength is the program's whole scorecard.</p>
          ) : (
            <div className="mt-4 space-y-3">
              {stdRows.map((r) => (
                <div key={r.name}>
                  <div className="flex items-baseline justify-between">
                    <span className="text-[13px]" style={{ color: C.bone }}>{r.label}</span>
                    <span className="font-mono text-[11px]" style={{ color: r.tier >= 0 ? C.gold : C.ashDim }}>{r.tier >= 0 ? TIERS[r.tier] : "Building"}{r.hasData ? "" : " · est"}</span>
                  </div>
                  <div className="mt-1 flex items-center gap-2">
                    <div className="h-1.5 flex-1 overflow-hidden rounded-full" style={{ background: "#2A2418" }}>
                      <div className="h-full rounded-full" style={{ width: `${r.prog * 100}%`, background: r.tier >= 2 ? C.sage : C.gold, transition: "width .4s ease" }} />
                    </div>
                    <span className="font-mono text-[10px]" style={{ color: C.ash }}>{dispW(r.pair, unit)} {uw(unit)} · {r.ratio.toFixed(2)}×</span>
                  </div>
                  <p className="mt-0.5 font-mono text-[9px]" style={{ color: C.ashDim }}>
                    {r.nextTier ? `${r.nextTier} at ${dispW(r.nextTargetPair, unit)} ${uw(unit)} pair (≈${dispW(r.nextTargetPair / 2, unit)}/hand)` : "top tier reached"}
                    {r.ceiling ? ` · exceeds ${dispW(90, unit)} ${uw(unit)}/hand — rep & tempo work from here` : ""}
                  </p>
                </div>
              ))}
              <p className="font-mono text-[9px] leading-relaxed" style={{ color: C.ashDim }}>load = both DBs ÷ bodyweight at an est. 5-rep max · directional (the book's numbers are barbell-based) · the back/chin standard needs a pull-up bar, so it isn't tracked</p>
            </div>
          )}

          <div className="mt-5 border-t pt-4" style={{ borderColor: C.edge }}>
            <span className="font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}>Lean-waist standard (optional)</span>
            {body.waist && body.height ? (
              <p className="mt-2 font-mono text-[10px]" style={{ color: C.ash }}>waist {Math.round(waistPct * 100)}% of height · <span style={{ color: waistTier >= 0 ? C.gold : C.ashDim }}>{waistTier >= 0 ? TIERS[waistTier] : "above Good"}</span> <span style={{ color: C.ashDim }}>(Good ≤47 · Great ≤46 · Godlike ≤45%)</span></p>
            ) : (
              <p className="mt-2 font-mono text-[9px]" style={{ color: C.ashDim }}>add height + waist in the <span style={{ color: C.gold }}>Diet</span> tab for the lean-waist standard</p>
            )}
          </div>
        </div>
        </>)}

        {tab === "diet" && (
          <DietView mem={mem} unit={mem.dietUnit || "kg"} setDietUnit={setDietUnit} logFood={logFood} editEntry={editEntry} corrFood={corrFood} removeEntry={removeEntry} addFood={addFood} removeFood={removeFood} toggleFav={toggleFav} favFood={favFood} addMeal={addMeal} removeMeal={removeMeal} logMeal={logMeal} logPlate={logPlate} copyDay={copyDay} setSteps={setSteps} addWater={addWater} removeWaterEntry={removeWaterEntry} setSleepToday={setSleepToday} setSleepDefault={setSleepDefault} setNutGoals={setNutGoals} setProxyUrl={setProxyUrl} setGeminiKey={setGeminiKey} setUsdaKey={setUsdaKey} setBody={setBody} logBW={logBW} />
        )}

        {tab === "cardio" && (
          <CardioView mem={mem} importCardioExport={importCardioExport} addManualCardio={addManualCardio} removeManualCardio={removeManualCardio} />
        )}

        {/* shared cross-device sync (app-wide, both tabs) */}
        {CIPHER_ACTIVE ? (
          syncLocked ? (
            <SyncLock onUnlock={unlockSync} msg={syncMsg} />
          ) : (
            <div className="mt-6 flex items-center justify-between rounded-2xl border px-5 py-3" style={{ background: C.card, borderColor: C.edge }}>
              <div className="flex flex-col">
                <span className="font-mono text-[11px] uppercase tracking-[0.2em]" style={{ color: C.ash }}>Cross-device sync</span>
                <span className="mt-0.5 flex items-center gap-1.5 font-mono text-[10px]" style={{ color: C.sage }}><Check size={11} /> {syncMsg && /error|fail|offline|wrong/i.test(syncMsg) ? <span style={{ color: C.rust }}>{syncMsg}</span> : (syncMsg || "on · auto")}</span>
                <span className="mt-0.5 font-mono text-[9px]" style={{ color: C.ashDim }}>build {BUILD}</span>
              </div>
              <button onClick={forceSync} className="flex items-center gap-1.5 rounded-full border px-4 py-2 font-mono text-[11px] uppercase tracking-wider active:scale-95" style={{ borderColor: C.goldDim, color: C.gold }}><RefreshCw size={12} /> Refresh</button>
            </div>
          )
        ) : (
          <SyncPanel sync={sync} msg={syncMsg} log={syncLog} onConnect={connectSync} onDisconnect={disconnectSync} onSyncNow={syncNow} />
        )}

        <div className="mt-6 flex items-center justify-between border-t pt-5" style={{ borderColor: C.edge }}>
          <p className="font-mono text-[10px] uppercase tracking-wider" style={{ color: C.goldDim }}>v0.21 · live cross-device sync · github · lb / kg{!hasStore ? " · session-only here" : ""}</p>
          {confirm === "reset" ? (
            <span className="flex items-center gap-2 font-mono text-[10px] uppercase tracking-wider">
              <span style={{ color: C.rust }}>erase all history?</span>
              <button onClick={() => { setConfirm(null); resetMemory(); }} style={{ color: C.rust }}>yes</button>
              <button onClick={() => setConfirm(null)} style={{ color: C.ash }}>no</button>
            </span>
          ) : (
            <button onClick={() => setConfirm("reset")} className="flex items-center gap-1 font-mono text-[10px] uppercase tracking-wider" style={{ color: C.ashDim }}><RotateCcw size={11} /> reset</button>
          )}
        </div>
      </div>
      {reviewOpen && (
        <ReviewDay plan={plan} units={units} mem={mem} unit={unit} done={done} bars={bars} onClose={() => setReviewOpen(false)}
          onJump={(unitIdx) => { if (unitIdx >= 0) setPage(unitIdx); setReviewOpen(false); }} />
      )}
    </div>
  );
}


createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
